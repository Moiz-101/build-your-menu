<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F7F1E6;color:#1B2B27;font-family:'DM Sans',system-ui,sans-serif;
     display:flex;justify-content:center;align-items:stretch}
input,select,button,textarea{font-family:inherit}
.shell{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:#F7F1E6;overflow:hidden;position:relative}

header{background:#0E3B33;padding:10px 16px 10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header img{height:30px;width:auto;display:block}
header .t{display:flex;flex-direction:column;gap:1px;min-width:0}
header .t b{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:19px;color:#FBF6EA;line-height:1.1}
header .t span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#C9D6D1}
header .more{position:relative;margin-left:auto;background:transparent;border:1.5px solid #C9963B;color:#E9C77E;
     border-radius:10px;height:34px;width:38px;font-size:17px;font-weight:700;cursor:pointer;
     line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- the drop-down of filters and settings ---------- */
#menu[hidden]{display:none}
#menu{position:absolute;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(14,59,51,.35)}
#menu .panel{background:#FBF6EA;border-bottom:1.5px solid #D9CBAB;padding:10px 16px 16px;
     display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 18px rgba(14,59,51,.2);
     max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#menu .dates{display:flex;gap:8px;padding:2px 2px 6px}
#menu .dates label{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;
     font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#7A6A4A;font-weight:700}
#menu .dates input{height:40px;border:1.5px solid #DDD3BF;border-radius:10px;padding:0 8px;
     font-size:15px;background:#fff;color:#1B2B27;width:100%;-webkit-appearance:none;line-height:38px}
#menu .apply{justify-content:center;background:#0E3B33;color:#FBF6EA;font-weight:700;margin:0 2px 2px}
#menu .clear{justify-content:center;background:#EADFC8;color:#0E3B33;font-weight:700;margin:2px}
header .more.on::before{content:'';position:absolute;width:9px;height:9px;border-radius:50%;
     background:#C62828;transform:translate(13px,-11px);border:1.5px solid #0E3B33}
#menu h4{margin:6px 2px 2px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#7A6A4A;font-weight:700}
#menu button{text-align:left;background:transparent;border:none;border-radius:10px;padding:11px 12px;
     font-size:15px;font-weight:600;color:#1B2B27;cursor:pointer;display:flex;align-items:center;gap:8px}
#menu button[aria-checked="true"]{background:#EADFC8;color:#0E3B33}
#menu button[aria-checked="true"]::after{content:'✓';margin-left:auto;color:#0E3B33;font-weight:700}
#menu .danger{color:#9B1C1C}
#menu hr{border:none;border-top:1px solid #E4D9C2;margin:6px 0}

/* ---------- the three status tabs ---------- */
#tabs[hidden]{display:none}
#tabs{display:flex;gap:6px;padding:8px 16px;background:#EADFC8;border-bottom:1px solid #D9CBAB;flex-shrink:0}
#tabs button{flex:1 1 0;min-width:0;height:40px;border-radius:11px;border:none;cursor:pointer;
     font-size:13px;font-weight:700;color:#0E3B33;background:transparent;
     display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
#tabs button[aria-selected="true"]{background:#FFFFFF;box-shadow:0 1px 3px rgba(14,59,51,.18)}
#tabs .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
     padding:0 6px;border-radius:999px;background:#C62828;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
#tabs .badge[hidden]{display:none}
#tabs button.hot{color:#9B1C1C}
#tabs button.hot[aria-selected="true"]{background:#FDECEA;box-shadow:inset 0 0 0 1.5px #C62828}

main{flex-grow:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
     padding:14px 16px 28px 16px;display:flex;flex-direction:column;gap:10px}
main > *,#sheetBody > *{flex-shrink:0}

.card{background:#fff;border:1.5px solid #E4D9C2;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card.unseen{border-color:#C62828;box-shadow:0 0 0 1px #C62828 inset}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.name{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;line-height:1.15;color:#0E3B33}
.meta{font-size:13.5px;line-height:1.45;color:#4A5A55}
.meta b{color:#1B2B27;font-weight:700}
.when{font-size:12px;color:#8A9491;white-space:nowrap}
.ref{font-size:12px;font-weight:700;letter-spacing:.5px;color:#6A4E12}

/* ---------- the 5-step bar, same shape as the customer sees ---------- */
.steps{display:flex;align-items:center;gap:0;padding:2px 0}
.steps .dot{width:22px;height:22px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;
     justify-content:center;font-size:11px;font-weight:700;background:#EADFC8;color:#A08F6B}
.steps .dot.done{background:#0E3B33;color:#E9C77E}
.steps .dot.now{background:#C9963B;color:#2A1B02;box-shadow:0 0 0 3px rgba(201,150,59,.25)}
.steps .bar{flex:1 1 auto;height:2px;background:#EADFC8;min-width:6px}
.steps .bar.done{background:#0E3B33}

.acts{display:flex;gap:7px}
.acts a,.acts button{flex:1 1 0;min-width:0;text-align:center;text-decoration:none;height:40px;line-height:38px;
     border-radius:12px;font-size:13.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer;padding:0}
.view{background:#C9963B;color:#2A1B02;border-color:#C9963B}
.wa{background:#0E3B33;color:#FBF6EA;border-color:#0E3B33}
.call{background:#fff;color:#0E3B33;border-color:#0E3B33}

.muted{font-size:13.5px;color:#5A6863;text-align:center;padding:30px 12px;line-height:1.55}
.count{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:#4A5A55;padding:2px 2px 0}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:1.2px;
     text-transform:uppercase;font-weight:700;color:#4A5A55}
label.f input{height:44px;border:1.5px solid #DDD3BF;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;color:#1B2B27}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;
     border:1.5px solid #E4D9C2;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:#0E3B33;flex-shrink:0}
.save{height:46px;border:none;border-radius:14px;background:#0E3B33;color:#FBF6EA;font-size:16px;font-weight:700;cursor:pointer}
.note{font-size:12.5px;color:#5A6863;line-height:1.45}
.err{background:#FDECEA;border:1.5px solid #C62828;color:#9B1C1C;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.45}
.ok{background:#D3E7DE;border:1.5px solid #2F7A64;color:#12604B;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.45}

.login{margin:auto;width:100%;max-width:330px;display:flex;flex-direction:column;gap:12px;padding:20px}
.login h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;margin:0;color:#0E3B33;text-align:center}

/* ---------- the order sheet ---------- */
#sheet[hidden]{display:none}
#sheet{position:absolute;inset:0;background:#F7F1E6;z-index:20;display:flex;flex-direction:column}
#sheet .bar{background:#0E3B33;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#sheet .bar button{background:transparent;border:1.5px solid #C9963B;color:#E9C77E;border-radius:10px;
     height:34px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer}
#sheet .bar b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16px;color:#FBF6EA;
     margin-left:auto;letter-spacing:.3px}
#sheetBody{flex-grow:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px 16px;
     display:flex;flex-direction:column;gap:10px}
.sec{background:#fff;border:1.5px solid #E4D9C2;border-radius:16px;overflow:hidden}
.sec h3{margin:0;background:#EADFC8;padding:8px 14px;font-family:'Fraunces',Georgia,serif;
     font-weight:600;font-size:14px;color:#0E3B33;letter-spacing:.3px}
.sec .body{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.kv{display:flex;gap:10px;font-size:13.5px;line-height:1.4}
.kv span{color:#5A6863;flex:0 0 40%}
.kv b{color:#1B2B27;font-weight:600;flex:1 1 auto}
.dish{font-size:13.5px;line-height:1.45;color:#1B2B27;display:flex;gap:7px}
.dish i{color:#C9963B;font-style:normal;flex-shrink:0}
.dish em{display:block;font-style:normal;font-size:12px;color:#8A6D2F;margin-top:1px}
.tot{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;line-height:1.4}
.tot.big{border-top:1.5px solid #E4D9C2;padding-top:8px;margin-top:2px;font-size:16px}
.tot.big b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;color:#0E3B33}
</style>
</head>
<body>
<div class="shell">
  <header>
    <img src="../images/web/logo.png" alt="">
    <div class="t"><span>Dragon Empire</span><b>Enquiries</b></div>
    <button class="more" id="more" hidden aria-label="Filters and settings">&#9776;</button>
  </header>

  <div id="tabs" hidden>
    <button data-view="progress" aria-selected="true">In Progress</button>
    <button data-view="confirmed" aria-selected="false">Confirmed</button>
    <button data-view="new" class="hot" aria-selected="false">New <span class="badge" id="badge" hidden>0</span></button>
  </div>

  <main id="main">
    <div class="login" id="login">
      <h1>Sign in</h1>
      <label class="f">Email
        <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com">
      </label>
      <label class="f">Password
        <input id="pass" type="password" autocomplete="current-password" placeholder="Your password">
      </label>
      <button class="save" id="send">Sign in</button>
      <div id="loginMsg"></div>
      <div class="note" style="text-align:center">You stay signed in on this phone, so this is a one-off.</div>
    </div>
  </main>

  <div id="menu" hidden><div class="panel" id="menuPanel"></div></div>

  <div id="sheet" hidden>
    <div class="bar">
      <button id="sheetBack">Back</button>
      <button id="sheetPdf">Save PDF</button>
      <b id="sheetRef"></b>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- The order sheet is rebuilt with the very same menu, prices and PDF builder
     the customer used, so what is shown here is what they were sent. -->
<script>
window.DCLogic = function (p) { this.props = p || {}; this.state = {}; };
window.DCLogic.prototype.setState = function (o) {
  Object.assign(this.state, typeof o === 'function' ? o(this.state) : o);
};
window.DISH_PHOTOS = {}; window.DISH_PHOTOS_BY_COURSE = {};
</script>
<script src="component.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';
  var URL_ = 'https://nrnhkuxtnbsjiyfhmwpm.supabase.co';
  var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ybmhrdXh0bmJzaml5Zmhtd3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzcwNDksImV4cCI6MjEwNTc1MzA0OX0.zSWpXCMOhua6GfbmSa41iKRCgHPo51eDdo6Fum_AZGc';
  var sb = window.supabase.createClient(URL_, KEY);

  var main   = document.getElementById('main');
  var tabs   = document.getElementById('tabs');
  var badge  = document.getElementById('badge');
  var menu   = document.getElementById('menu');
  var more   = document.getElementById('more');
  var login  = document.getElementById('login');
  var sheet  = document.getElementById('sheet');
  var sheetBody = document.getElementById('sheetBody');

  var view = 'progress';       // progress | confirmed | new | settings
  var rows = [];               // every lead, newest first
  var openInst = null;
  var refresh = null;

  // what the menu is currently narrowing the lists down to
  var F = { range: 'all', from: '', to: '', sort: 'recent', emirate: '', minPax: 0 };
  function filtersOn() {
    return F.range !== 'all' || F.sort !== 'recent' || F.emirate !== '' || F.minPax > 0;
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function digits(p) { return String(p || '').replace(/[^0-9]/g, ''); }

  /* Dubai never changes its clock, so "today" is simply the day there now. */
  function dayStart() {
    var ymd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dubai' }).format(new Date());
    return new Date(ymd + 'T00:00:00+04:00');
  }

  function inRange(l) {
    var t = new Date(l.updated_at).getTime();
    if (F.range === 'today') return t >= dayStart().getTime();
    if (F.range === 'week')  return t >= Date.now() - 7 * 86400000;
    if (F.range === 'custom') {
      // the boxes are Dubai days, and "to" means the whole of that day
      if (F.from && t < new Date(F.from + 'T00:00:00+04:00').getTime()) return false;
      if (F.to   && t > new Date(F.to   + 'T23:59:59+04:00').getTime()) return false;
      return true;
    }
    return true;
  }

  function orderValue(l) { return (((l.details || {}).totals || {}).grand) || 0; }

  /* Everything the menu asks for, applied in one place. */
  function sift(list) {
    var out = list.filter(function (l) {
      if (!inRange(l)) return false;
      if (F.emirate && (l.emirate || '') !== F.emirate) return false;
      if (F.minPax && !(l.pax >= F.minPax)) return false;
      return true;
    });
    if (F.sort === 'event') {
      out.sort(function (a, b) {
        if (!a.event_date) return 1;            // no date yet, push to the bottom
        if (!b.event_date) return -1;
        return a.event_date < b.event_date ? -1 : a.event_date > b.event_date ? 1 : 0;
      });
    } else if (F.sort === 'value') {
      out.sort(function (a, b) { return orderValue(b) - orderValue(a); });
    }
    return out;                                 // 'recent' is the order they arrive in
  }

  function when(d, t) {
    if (!d) return 'Date not set';
    var p = String(d).split('-');
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1] - 1] || '';
    return p[2] + ' ' + m + ' ' + p[0] + (t ? ', ' + t : '');
  }

  /* When it happened, in Dubai time. Inside the last 24 hours the clock time is
     what you want ("was that before or after lunch?"); older than that, the day
     itself is the useful fact. "3d ago" told you neither. */
  // assembled from parts so the order is always "17 Sep", never "Sep 17",
  // and the month stays three letters whatever the phone's locale data says
  function dubaiParts(d, opts) {
    opts.timeZone = 'Asia/Dubai';
    var out = {};
    new Intl.DateTimeFormat('en-US', opts).formatToParts(d).forEach(function (p) { out[p.type] = p.value; });
    return out;
  }

  function stamp(iso) {
    if (!iso) return '';
    var t = new Date(iso);
    if (isNaN(t.getTime())) return '';
    var age = Date.now() - t.getTime();

    if (age < 86400000 && age > -300000) {
      var c = dubaiParts(t, { hour: 'numeric', minute: '2-digit', hour12: true });
      return c.hour + ':' + c.minute + ' ' + (c.dayPeriod || '');
    }

    var p = dubaiParts(t, { day: '2-digit', month: 'short', year: 'numeric' });
    var thisYear = dubaiParts(new Date(), { year: 'numeric' }).year;
    return p.day + ' ' + p.month.slice(0, 3) + (p.year === thisYear ? '' : ' ' + p.year.slice(2));
  }

  /* ---------------- the step bar ----------------
     The customer's screens run details > setup > packages > dishes > theme,
     which is the "Step n of 5" bar they see. Review means all five are behind
     them and they are one tap from confirming. */
  var FLOW = ['details', 'setup', 'pkg', 'items', 'theme'];
  var STEP_NAME = { details:'their details', setup:'the setup', pkg:'packages',
                    items:'choosing dishes', theme:'the event theme',
                    review:'the final review', thanks:'the end' };

  function stepNo(step) {
    var i = FLOW.indexOf(step);
    if (i >= 0) return i + 1;
    return 5;                              // review or thanks: all five behind them
  }

  function stepBar(l) {
    var at = stepNo(l.step);
    var atReview = (l.step === 'review' || l.step === 'thanks');
    var html = '<div class="steps" aria-label="Reached step ' + at + ' of 5">';
    for (var n = 1; n <= 5; n++) {
      var cls = 'dot';
      if (n < at) cls += ' done';
      else if (n === at) cls += atReview ? ' done' : ' now';
      html += '<span class="' + cls + '">' + n + '</span>';
      if (n < 5) html += '<span class="bar' + (n < at ? ' done' : '') + '"></span>';
    }
    return html + '</div>';
  }

  /* ---------------- rebuilding a customer's order ---------------- */

  function rebuild(l) {
    var o = (l.details || {}).order;
    // a top-level `class` is a global binding, not a property of window
    if (!o || !o.choices || typeof Component !== 'function') return null;
    var inst;
    try { inst = new Component({}); } catch (e) { return null; }
    Object.assign(inst.state, o.choices);
    // only a confirmed order has a number; don't invent one for an enquiry
    inst.REF = l.ref || 'DRAFT';

    // dishes are matched by name and course, so an order survives menu changes
    var sel = {}, notes = {};
    (o.picked || []).forEach(function (p) {
      for (var i = 0; i < inst.ITEMS.length; i++) {
        var x = inst.ITEMS[i];
        if (x.name === p.name && x.cat === p.cat && !sel[x.id]) {
          sel[x.id] = true;
          if (p.note) notes[x.id] = p.note;
          return;
        }
      }
    });
    inst.state.sel = sel;
    inst.state.notes = notes;
    try { inst.summary(); } catch (e) { return null; }
    return inst;
  }

  function kv(k, v) { return '<div class="kv"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }

  async function markSeen(l) {
    if (l.status !== 'completed' || l.seen_at) return;
    l.seen_at = new Date().toISOString();       // update the screen straight away
    paintBadge();
    var r = await sb.from('leads').update({ seen_at: l.seen_at }).eq('session_id', l.session_id);
    if (r.error) { l.seen_at = null; paintBadge(); }   // put it back if it did not save
  }

  function showSheet(l) {
    var inst = rebuild(l);
    if (!inst) {
      alert('This enquiry was saved before the order sheet existed, so there is nothing to show yet.');
      return;
    }
    markSeen(l);
    openInst = inst;
    var S = inst.summary();
    document.getElementById('sheetRef').textContent = S.ref;

    var html =
      '<div class="sec"><h3>Customer</h3><div class="body">' +
        kv('Name', S.name) + kv('Contact', S.contact) + kv('Emirate', S.emirate) +
        kv('Event', S.when) + kv('Guests', S.pax) + kv('Pure Veg', S.veg) +
      '</div></div>' +
      '<div class="sec"><h3>Setup</h3><div class="body">' +
        kv('Service', S.typeLabel) +
        (S.isOnsite ? kv('Style', S.layoutLabel) + kv('Venue', S.venueLabel) : '') +
      '</div></div>' +
      '<div class="sec"><h3>Menu</h3><div class="body">' +
        kv('Package', S.pkgLabel) + kv('Cuisine', S.cuisine) + kv('Per person', S.ppText) +
      '</div></div>';

    S.groups.forEach(function (g) {
      html += '<div class="sec"><h3>' + esc(g.title) + '</h3><div class="body">' +
        g.items.map(function (it) {
          return '<div class="dish"><i>&#9679;</i><div>' + esc(it.name) +
                 (it.hasNote ? '<em>' + esc(it.note) + '</em>' : '') + '</div></div>';
        }).join('') + '</div></div>';
    });

    html += '<div class="sec"><h3>Theme &amp; notes</h3><div class="body">' +
        kv('Theme', S.themeLabel) + kv('Notes', S.notesText) +
      '</div></div>' +
      '<div class="sec"><h3>Total</h3><div class="body">' +
        '<div class="tot"><span>' + esc(S.menuRowLabel) + '</span><span>' + esc(S.menuRowValue) + '</span></div>' +
        (S.showMin ? '<div class="tot"><span>Minimum order top-up</span><span>' + esc(S.minValue) + '</span></div>' : '') +
        '<div class="tot"><span>' + esc(S.themeRowLabel) + '</span><span>' + esc(S.themeRowValue) + '</span></div>' +
        '<div class="tot big"><span>Grand total</span><b>' + esc(S.grand) + '</b></div>' +
      '</div></div>' +
      '<div class="note">' + (l.status === 'completed'
        ? 'This is the copy the customer downloaded when they confirmed.'
        : 'Not confirmed yet - this is how far the customer had got.') + '</div>';

    sheetBody.innerHTML = html;
    sheetBody.scrollTop = 0;
    sheet.hidden = false;
  }

  document.getElementById('sheetBack').onclick = function () {
    sheet.hidden = true; openInst = null; draw();
  };

  document.getElementById('sheetPdf').onclick = function () {
    if (!openInst) return;
    var blob;
    try { blob = openInst.buildPdf(); }
    catch (e) { alert('Could not build the PDF for this order.'); return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Catering-Order-' + openInst.REF + '.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
  };

  /* ---------------- the cards ---------------- */

  function buttons(l, i) {
    var wa = digits(l.phone);
    var canView = !!((l.details || {}).order || {}).choices;
    return '<div class="acts">' +
      (canView ? '<button class="view" data-view-idx="' + i + '">View</button>' : '') +
      (wa ? '<a class="wa" href="https://wa.me/' + wa + '">WhatsApp</a>' : '') +
      (wa ? '<a class="call" href="tel:+' + wa + '">Call</a>' : '') +
    '</div>';
  }

  function progressCard(l, i) {
    return '<div class="card">' +
      '<div class="row"><div class="name">' + esc(l.name || 'No name') + '</div>' +
        '<span class="when">' + esc(stamp(l.updated_at)) + '</span></div>' +
      '<div class="meta"><b>' + esc(when(l.event_date, l.event_time)) + '</b>' +
        (l.pax ? ' &middot; <b>' + esc(l.pax) + '</b> guests' : '') + '</div>' +
      stepBar(l) +
      buttons(l, i) +
    '</div>';
  }

  function orderCard(l, i) {
    var totals = (l.details || {}).totals || {};
    var unseen = !l.seen_at;
    return '<div class="card' + (unseen ? ' unseen' : '') + '">' +
      '<div class="row"><div class="name">' + esc(l.name || 'No name') + '</div>' +
        '<span class="when">' + esc(stamp(l.completed_at || l.updated_at)) + '</span></div>' +
      '<div class="meta"><b>' + esc(when(l.event_date, l.event_time)) + '</b>' +
        (l.pax ? ' &middot; <b>' + esc(l.pax) + '</b> guests' : '') + '</div>' +
      '<div class="row"><span class="ref">' + esc(l.ref || 'No number') + '</span>' +
        (totals.grandText ? '<span class="meta"><b>' + esc(totals.grandText) + '</b></span>' : '') + '</div>' +
      buttons(l, i) +
    '</div>';
  }

  /* ---------------- the lists ---------------- */

  function unseenOrders() {
    // never hidden by the date filter: an unchecked order always matters
    return rows.filter(function (l) { return l.status === 'completed' && !l.seen_at; });
  }

  function paintBadge() {
    var n = unseenOrders().length;
    badge.textContent = n;
    badge.hidden = (n === 0);
  }

  function listOf(items, empty, render) {
    if (!items.length) return '<div class="muted">' + empty + '</div>';
    return '<div class="count">' + items.length + (items.length === 1 ? ' person' : ' people') + '</div>' +
      items.map(function (l) { return render(l, rows.indexOf(l)); }).join('');
  }

  function wireCards() {
    [].forEach.call(main.querySelectorAll('[data-view-idx]'), function (b) {
      b.onclick = function () { showSheet(rows[+b.dataset.viewIdx]); };
    });
  }

  function paintList() {
    more.classList.toggle('on', filtersOn());
    var none = filtersOn() ? ' Nothing matches the filters you have set.' : '';
    if (view === 'progress') {
      var open = sift(rows.filter(function (l) { return l.status !== 'completed'; }));
      main.innerHTML = listOf(open,
        'Nobody is part way through right now. People appear here as soon as they fill in the first page.' + none,
        progressCard);
    } else if (view === 'confirmed') {
      var done = sift(rows.filter(function (l) { return l.status === 'completed'; }));
      main.innerHTML = listOf(done, 'No confirmed orders yet.' + none, orderCard);
    } else {
      main.innerHTML = listOf(unseenOrders(),
        'All caught up. Every order has been opened.', orderCard);
    }
    wireCards();
    paintBadge();
  }

  /* ---------------- alert settings ---------------- */

  async function showSettings() {
    main.innerHTML = '<div class="muted">Loading…</div>';
    var res = await sb.from('alert_settings').select('*').limit(1).single();
    if (res.error) { main.innerHTML = '<div class="err">' + esc(res.error.message) + '</div>'; return; }
    var s = res.data;
    var linked = (s.telegram_chat_ids || []).length;

    main.innerHTML =
      (linked
        ? '<div class="ok">Telegram is connected. Alerts go to ' + linked +
          (linked === 1 ? ' chat.' : ' chats.') + '</div>'
        : '<div class="err">Telegram is not connected yet, so nothing can be sent.</div>') +
      '<div class="toggle"><span>Send me alerts</span>' +
        '<input id="en" type="checkbox" ' + (s.enabled ? 'checked' : '') + '></div>' +
      '<label class="f">Tell me if a customer stops for (minutes)' +
        '<input id="mins" type="number" min="1" max="180" value="' + esc(s.stop_after_mins) + '">' +
      '</label>' +
      '<div class="toggle"><span>Also ping me on every link open</span>' +
        '<input id="vis" type="checkbox" ' + (s.alert_on_visit ? 'checked' : '') + '></div>' +
      '<div class="note">Leave that one off unless it is a quiet week - ten opens a day means ten buzzes.</div>' +
      '<button class="save" id="saveSet">Save</button>' +
      '<div id="setMsg"></div>';

    document.getElementById('saveSet').onclick = async function () {
      var msg = document.getElementById('setMsg');
      var upd = await sb.from('alert_settings').update({
        enabled: document.getElementById('en').checked,
        alert_on_visit: document.getElementById('vis').checked,
        stop_after_mins: Math.max(1, Math.min(180, +document.getElementById('mins').value || 15)),
        updated_at: new Date().toISOString()
      }).eq('id', true);
      msg.className = upd.error ? 'err' : 'ok';
      msg.textContent = upd.error ? upd.error.message : 'Saved.';
    };
  }

  /* ---------------- loading and drawing ---------------- */

  async function load() {
    var res = await sb.from('leads').select('*').order('updated_at', { ascending: false }).limit(300);
    if (res.error) { main.innerHTML = '<div class="err">' + esc(res.error.message) + '</div>'; return false; }
    rows = res.data || [];
    return true;
  }

  async function draw() {
    if (view === 'settings') { showSettings(); return; }
    if (!rows.length) main.innerHTML = '<div class="muted">Loading…</div>';
    if (await load()) paintList();
  }

  [].forEach.call(tabs.querySelectorAll('button'), function (b) {
    b.onclick = function () {
      [].forEach.call(tabs.querySelectorAll('button'), function (x) { x.setAttribute('aria-selected', 'false'); });
      b.setAttribute('aria-selected', 'true');
      view = b.dataset.view;
      paintList();
    };
  });

  /* ---------------- the filter menu ---------------- */

  var panel = document.getElementById('menuPanel');

  function opt(kind, value, label, on) {
    return '<button data-' + kind + '="' + esc(value) + '" aria-checked="' + (on ? 'true' : 'false') + '">' +
           esc(label) + '</button>';
  }

  function buildMenu() {
    // only offer emirates that actually appear in the enquiries
    var seen = {}, places = [];
    rows.forEach(function (l) {
      if (l.emirate && !seen[l.emirate]) { seen[l.emirate] = 1; places.push(l.emirate); }
    });
    places.sort();

    var html = '<h4>Show</h4>' +
      opt('range', 'all',    'Everything',   F.range === 'all') +
      opt('range', 'today',  'Today only',   F.range === 'today') +
      opt('range', 'week',   'Last 7 days',  F.range === 'week') +
      opt('range', 'custom', 'Chosen dates', F.range === 'custom') +
      '<div class="dates">' +
        '<label>From<input type="date" id="fFrom" value="' + esc(F.from) + '"></label>' +
        '<label>To<input type="date" id="fTo" value="' + esc(F.to) + '"></label>' +
      '</div>' +
      '<button class="apply" data-act="applyDates">Use these dates</button>' +

      '<h4>Sort by</h4>' +
      opt('sort', 'recent', 'Latest activity',      F.sort === 'recent') +
      opt('sort', 'event',  'Event date, soonest',  F.sort === 'event') +
      opt('sort', 'value',  'Biggest order first',  F.sort === 'value') +

      '<h4>Party size</h4>' +
      opt('pax', '0',   'Any size',       !F.minPax) +
      opt('pax', '50',  '50 guests or more',  F.minPax === 50) +
      opt('pax', '100', '100 guests or more', F.minPax === 100);

    if (places.length > 1) {
      html += '<h4>Emirate</h4>' + opt('emirate', '', 'Everywhere', !F.emirate);
      places.forEach(function (p) { html += opt('emirate', p, p, F.emirate === p); });
    }

    if (filtersOn()) html += '<button class="clear" data-act="clear">Clear all filters</button>';

    html += '<hr><h4>Settings</h4>' +
      '<button data-act="settings">Alert settings</button>' +
      '<button data-act="refresh">Refresh now</button>' +
      '<button data-act="signout" class="danger">Sign out</button>';

    panel.innerHTML = html;
    wireMenu();
  }

  function wireMenu() {
    [].forEach.call(panel.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        var d = b.dataset;
        if (d.range)        { F.range = d.range; if (d.range !== 'custom') { F.from = ''; F.to = ''; } }
        else if (d.sort)    { F.sort = d.sort; }
        else if (b.hasAttribute('data-pax')) { F.minPax = +d.pax; }
        else if (b.hasAttribute('data-emirate')) { F.emirate = d.emirate; }
        else if (d.act === 'applyDates') {
          F.from = document.getElementById('fFrom').value;
          F.to   = document.getElementById('fTo').value;
          F.range = (F.from || F.to) ? 'custom' : 'all';
        }
        else if (d.act === 'clear') { F = { range:'all', from:'', to:'', sort:'recent', emirate:'', minPax:0 }; }
        else {
          menu.hidden = true;
          if (d.act === 'settings') {
            view = 'settings';
            [].forEach.call(tabs.querySelectorAll('button'), function (x) { x.setAttribute('aria-selected', 'false'); });
            showSettings();
          } else if (d.act === 'refresh') {
            if (view === 'settings') {
              view = 'progress';
              tabs.querySelector('[data-view="progress"]').setAttribute('aria-selected', 'true');
            }
            draw();
          } else if (d.act === 'signout') {
            sb.auth.signOut().then(function () { location.reload(); });
          }
          return;
        }
        menu.hidden = true;
        if (view === 'settings') {
          view = 'progress';
          tabs.querySelector('[data-view="progress"]').setAttribute('aria-selected', 'true');
        }
        paintList();
      };
    });
  }

  more.onclick = function () {
    // hang the panel just under the tabs, so the header stays visible
    var t = tabs.getBoundingClientRect(), s = menu.parentNode.getBoundingClientRect();
    menu.style.top = Math.max(0, Math.round(t.bottom - s.top)) + 'px';
    buildMenu();
    menu.hidden = false;
  };
  menu.onclick = function (e) { if (e.target === menu) menu.hidden = true; };

  /* ---------------- signing in ---------------- */

  function blocked(text) {
    if (login && login.parentNode) login.remove();
    tabs.hidden = true;
    more.hidden = false;
    main.innerHTML = '<div class="err">' + text + '</div>';
  }

  async function enter() {
    var chk = await sb.rpc('is_admin');
    if (chk.error) { blocked('Signed in, but the owner check failed: ' + esc(chk.error.message)); return; }
    if (chk.data !== true) {
      blocked('This email is not on the owner list, so there is nothing to show. ' +
              'Sign out and try the other address.');
      return;
    }
    if (login && login.parentNode) login.remove();
    tabs.hidden = false; more.hidden = false;
    draw();
    if (!refresh) {
      refresh = setInterval(function () {
        if (view !== 'settings' && sheet.hidden && menu.hidden) draw();
      }, 60000);
    }
  }

  async function signIn() {
    var msg = document.getElementById('loginMsg');
    var btn = document.getElementById('send');
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;
    if (!email || !pass) { msg.className = 'err'; msg.textContent = 'Fill in both boxes.'; return; }
    btn.disabled = true;
    msg.className = 'note'; msg.textContent = 'Signing in…';
    var r;
    try { r = await sb.auth.signInWithPassword({ email: email, password: pass }); }
    catch (e) { r = { error: { message: String((e && e.message) || e) } }; }
    btn.disabled = false;

    if (r.error) {
      msg.className = 'err';
      msg.textContent = /invalid login/i.test(r.error.message)
        ? 'That email and password do not match an account.'
        : /not confirmed/i.test(r.error.message)
          ? 'That account still needs confirming in Supabase.'
          : r.error.message;
      return;
    }
    msg.className = 'note'; msg.textContent = 'Opening…';
    // show the panel here and now: reloading used to throw away the fresh session
    await enter();
  }

  document.getElementById('send').onclick = signIn;
  document.getElementById('pass').onkeydown = function (e) { if (e.key === 'Enter') signIn(); };
  document.getElementById('email').onkeydown = function (e) {
    if (e.key === 'Enter') document.getElementById('pass').focus();
  };

  async function boot() {
    var s;
    try { s = await sb.auth.getSession(); } catch (e) { return; }
    if (s && s.data && s.data.session) await enter();
  }
  boot();
})();
</script>
</body>
</html>
