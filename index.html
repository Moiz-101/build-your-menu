<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Build your Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F7F1E6}
input,select,button,textarea{font-family:inherit}
.fld:focus{outline:none;border-color:#0E3B33;box-shadow:0 0 0 3px rgba(201,150,59,0.35)}
.btn:focus-visible{outline:3px solid #C9963B;outline-offset:2px}
.fld::placeholder{color:#8A928D}
.rail{scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-left:24px}
.rail::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:start}
.btn[disabled]{cursor:not-allowed}
/* iPhone Safari gives date inputs a built-in minimum width and height, which made the
   date box spill under the Time box. Dropping the native styling makes it obey its column. */
input[type="date"].fld{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:10px 14px !important;line-height:20px}
/* Safari puts the chosen date at the top of the box: give it a fixed line so it sits in the middle */
input[type="date"].fld::-webkit-date-and-time-value{text-align:left;margin:0;line-height:20px;min-height:20px}
input[type="date"].fld[data-empty="true"]::-webkit-datetime-edit{opacity:0}
/* The outer frame is fluid: full height of the phone, 390px wide at most. */
html,body{height:100%}
body{box-sizing:border-box;display:flex;justify-content:center;align-items:stretch;color:#1B2B27}
#app{display:contents}
.app-shell{width:100%;max-width:390px;height:100%}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="app-shell" style="position: relative; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F1E6; color: #1B2B27; overflow: hidden;">

<!-- Header -->
<div style="background: #0E3B33; padding: 10px 24px; display: flex; align-items: center; gap: 12px;">
<img src="images/web/logo.png" alt="Dubai Catering Service" style="height: 34px; width: auto; flex-shrink: 0; display: block;">
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
<span style="font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #C9D6D1; font-weight: 500; line-height: 1.2;">Catering</span>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; font-size: 23px; line-height: 1.1; color: #FBF6EA;">Build your Menu!</h1>
</div>
</div>

<sc-if value="{{isDetails}}" hint-placeholder-val="{{true}}">
<!-- Stepper stripe -->
<div style="background: #EADFC8; border-bottom: 1px solid #D9CBAB; padding: 6px 28px; display: flex; align-items: center;" aria-label="Step 1 of 5">
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #0E3B33; color: #FBF6EA; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2.5px rgba(201,150,59,0.5);">1</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">2</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">3</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">4</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">5</div>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 24px 6px 24px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;">
<h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 15px; color: #0E3B33;">Customer Details</h2>
</div>

<!-- Name -->
<div style="display: flex; flex-direction: column; gap: 4px;">
<label for="name" style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55;">Name</label>
<div style="position: relative;">
<svg style="position: absolute; left: 14px; top: 12px; pointer-events: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
<input id="name" class="fld" type="text" value="{{name}}" onChange="{{setName}}" placeholder="Full name" autocomplete="name" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px 0 44px; border: 1.5px solid {{dNameBorder}}; border-radius: 14px; background: #FFFFFF; font-size: 16px; color: #1B2B27;">
</div>
</div>

<!-- Contact -->
<div style="display: flex; flex-direction: column; gap: 4px;">
<label for="phone" style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55;">Contact</label>
<div style="display: flex; gap: 10px;">
<div style="position: relative; width: 104px; flex-shrink: 0;">
<select id="cc" aria-label="Country code" class="fld" value="{{cc}}" onChange="{{setCc}}" style="appearance: none; -webkit-appearance: none; width: 100%; box-sizing: border-box; height: 44px; padding: 0 30px 0 14px; border: 1.5px solid #DDD3BF; border-radius: 14px; background: #FFFFFF; font-size: 16px; font-weight: 600; color: #1B2B27;">
<option value="+971">+971</option>
<option value="+966">+966</option>
<option value="+974">+974</option>
<option value="+968">+968</option>
<option value="+965">+965</option>
<option value="+973">+973</option>
<option value="+91">+91</option>
<option value="+92">+92</option>
<option value="+44">+44</option>
<option value="+1">+1</option>
</select>
<svg style="position: absolute; right: 12px; top: 15px; pointer-events: none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</div>
<input id="phone" class="fld" type="tel" value="{{phone}}" onChange="{{setPhone}}" inputmode="tel" placeholder="50 123 4567" autocomplete="tel-national" style="flex-grow: 1; min-width: 0; box-sizing: border-box; height: 44px; padding: 0 14px; border: 1.5px solid {{dPhoneBorder}}; border-radius: 14px; background: #FFFFFF; font-size: 16px; color: #1B2B27;">
</div>
</div>

<!-- Emirates -->
<div style="display: flex; flex-direction: column; gap: 4px;">
<label for="emirate" style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55;">Emirates</label>
<div style="position: relative;">
<svg style="position: absolute; left: 14px; top: 12px; pointer-events: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<select id="emirate" class="fld" value="{{emirate}}" onChange="{{setEmirate}}" style="appearance: none; -webkit-appearance: none; width: 100%; box-sizing: border-box; height: 44px; padding: 0 40px 0 44px; border: 1.5px solid #DDD3BF; border-radius: 14px; background: #FFFFFF; font-size: 16px; color: #1B2B27;">
<option value="">Select emirate</option>
<option>Abu Dhabi</option>
<option>Dubai</option>
<option>Sharjah</option>
<option>Ajman</option>
<option>Umm Al Quwain</option>
<option>Ras Al Khaimah</option>
<option>Fujairah</option>
</select>
<svg style="position: absolute; right: 14px; top: 15px; pointer-events: none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</div>

<!-- Event date + time -->
<div style="display: flex; flex-direction: column; gap: 4px;">
<label for="date" style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55;">Event Date</label>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px;">
<div style="position: relative; min-width: 0; display: flex;">
<input id="date" class="fld" type="date" data-empty="{{dateEmpty}}" value="{{date}}" onChange="{{setDate}}" style="width: 100%; min-width: 0; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1.5px solid {{dDateBorder}}; border-radius: 14px; background: #FFFFFF; font-size: 16px; color: #1B2B27;">
<sc-if value="{{dateEmpty}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="position: absolute; left: 14px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 16px; color: #8A928D; pointer-events: none;">Select date</span>
</sc-if>
</div>
<div style="position: relative; min-width: 0;">
<select id="time" aria-label="Event time" class="fld" value="{{time}}" onChange="{{setTime}}" style="appearance: none; -webkit-appearance: none; width: 100%; box-sizing: border-box; height: 44px; padding: 0 32px 0 14px; border: 1.5px solid #DDD3BF; border-radius: 14px; background: #FFFFFF; font-size: 16px; color: #1B2B27;">
<option value="">Time</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>01:00 PM</option>
<option>02:00 PM</option>
<option>03:00 PM</option>
<option>04:00 PM</option>
<option>05:00 PM</option>
<option>06:00 PM</option>
<option>07:00 PM</option>
<option>08:00 PM</option>
<option>09:00 PM</option>
</select>
<svg style="position: absolute; right: 12px; top: 15px; pointer-events: none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</div>
</div>

<!-- Pax -->
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55;">Pax</span>
<div style="display: flex; align-items: center; gap: 12px;">
<button class="btn" type="button" aria-label="Decrease guests" onClick="{{decPax}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #0E3B33; background: #FFFFFF; color: #0E3B33; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<input id="pax" class="fld" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="Number of guests" value="{{paxText}}" onChange="{{typePax}}" onBlur="{{blurPax}}" style="width: 92px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid transparent; background: rgba(14,59,51,0.12); color: #0E3B33; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; text-align: center; padding: 0;">
<button class="btn" type="button" aria-label="Increase guests" onClick="{{incPax}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #0E3B33; background: #FFFFFF; color: #0E3B33; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<span style="font-size: 16px; font-weight: 500; color: #4A5A55;">persons</span>
</div>
</div>

<!-- Pure veg -->
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 5px 5px 14px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #DDD3BF;">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
<div style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 4px; border: 2px solid #2E7D32; display: flex; align-items: center; justify-content: center;"><div style="width: 9px; height: 9px; border-radius: 50%; background: #2E7D32;"></div></div>
<span id="pv-label" style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55; white-space: nowrap;">Pure Veg?</span>
</div>
<div role="group" aria-labelledby="pv-label" style="display: flex; gap: 6px;">
<button class="btn" type="button" aria-pressed="{{pvYes.on}}" onClick="{{pvYes.pick}}" style="width: 72px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 700; border: 1.5px solid {{pvYes.border}}; background: {{pvYes.bg}}; color: {{pvYes.color}};">Yes</button>
<button class="btn" type="button" aria-pressed="{{pvNo.on}}" onClick="{{pvNo.pick}}" style="width: 72px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 700; border: 1.5px solid {{pvNo.border}}; background: {{pvNo.bg}}; color: {{pvNo.color}};">No</button>
</div>
</div>
</div><sc-if value="{{dWarnShown}}" hint-placeholder-val="{{false}}">
<span role="alert" style="display: block; padding: 0 24px; margin-top: 6px; font-size: 12px; font-weight: 700; line-height: 1.3; color: #B3261E;">{{dWarnText}}</span>
</sc-if>
<sc-if value="{{dConsentShown}}" hint-placeholder-val="{{true}}">
<span style="display: block; padding: 0 24px; margin-top: 6px; font-size: 11px; line-height: 1.3; color: #5A6863;">By continuing you agree that we may contact you about this booking.</span>
</sc-if>
<div style="padding: 10px 24px 14px 24px; display: flex; align-items: center; gap: 12px;">
<button class="btn" type="button" aria-label="Back" disabled="{{true}}" style="opacity: 0.35; cursor: not-allowed; width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; border: 1.5px solid #0E3B33; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</button>
<button class="btn" type="button" onClick="{{nextFromDetails}}" style="flex-grow: 1; height: 46px; text-decoration: none; border: none; border-radius: 14px; background: #0E3B33; color: #FBF6EA; font-size: 16px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 14px rgba(14,59,51,0.24);">
<span>Save &amp; Next</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E9C77E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>


</sc-if>
<sc-if value="{{isSetup}}" hint-placeholder-val="{{false}}">
<!-- Stepper stripe -->
<div style="background: #EADFC8; border-bottom: 1px solid #D9CBAB; padding: 6px 28px; display: flex; align-items: center;" aria-label="Step 2 of 5">
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #0E3B33; display: flex; align-items: center; justify-content: center;" aria-label="Step 1 done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E9C77E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></div>
<div style="flex-grow: 1; height: 2px; background: #0E3B33; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #0E3B33; color: #FBF6EA; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2.5px rgba(201,150,59,0.5);">2</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">3</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">4</div>
<div style="flex-grow: 1; height: 2px; background: #C9B98F; margin: 0 6px;"></div>
<div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #8B8467; color: #4A5A55; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center;">5</div>
</div>

<!-- Content -->
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 8px 24px; display: flex; flex-direction: column; gap: 16px;">
<h2 style="margin: 0; text-align: center; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 15px; letter-spacing: 2px; color: #0E3B33;">SETUP</h2>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: #4A5A55;">Catering Type</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<button class="btn" type="button" aria-pressed="{{delivery.on}}" onClick="{{delivery.pick}}" style="position: relative; display: flex; flex-direction: column; width: 100%; padding: 0; overflow: hidden; cursor: pointer; text-align: center; border-radius: 18px; background: #FFFFFF; border: 2.5px solid {{delivery.border}}; box-shadow: {{delivery.shadow}};">
<div style="height: 104px; width: 100%;"><svg width="100%" height="100%" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block"><rect width="160" height="100" fill="#F1E7D0"/><rect y="78" width="160" height="22" fill="#DCCDA8"/><path d="M6 89h20M46 89h20M86 89h20M126 89h20" stroke="#C9B98F" stroke-width="2" stroke-linecap="round"/>
<path d="M8 48h14M4 58h18M10 68h12" stroke="#C9B98F" stroke-width="2.5" stroke-linecap="round"/>
<rect x="28" y="36" width="72" height="40" rx="5" fill="#0E3B33"/><rect x="28" y="58" width="72" height="5" fill="#C9963B"/>
<path d="M100 46h20l13 15v15h-33z" fill="#145244"/><path d="M106 51h11l9 10h-20z" fill="#CFE3DC"/>
<circle cx="64" cy="47" r="6" fill="#E9C77E"/><path d="M60 47h8" stroke="#0E3B33" stroke-width="2" stroke-linecap="round"/>
<circle cx="50" cy="77" r="9" fill="#1B2B27"/><circle cx="50" cy="77" r="3.5" fill="#E9C77E"/><circle cx="115" cy="77" r="9" fill="#1B2B27"/><circle cx="115" cy="77" r="3.5" fill="#E9C77E"/></svg></div>
<sc-if value="{{delivery.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: #C9963B; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E3B33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></div>
</sc-if>
<span style="padding: 10px 6px; font-size: 15px; font-weight: 700; color: #0E3B33;">Delivery</span>
</button>
<button class="btn" type="button" aria-pressed="{{onsite.on}}" onClick="{{onsite.pick}}" style="position: relative; display: flex; flex-direction: column; width: 100%; padding: 0; overflow: hidden; cursor: pointer; text-align: center; border-radius: 18px; background: #FFFFFF; border: 2.5px solid {{onsite.border}}; box-shadow: {{onsite.shadow}};">
<div style="height: 104px; width: 100%;"><svg width="100%" height="100%" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display:block"><rect width="160" height="100" fill="#F1E7D0"/><path d="M0 14Q40 34 80 14Q120 34 160 14" stroke="#0E3B33" stroke-width="1.5" fill="none"/>

  }
  // Category rates for custom menus. Package price = base (salads, sides, service) + dishes x category rate.
  // Fitted from the 4 package prices: weighted dishes per package vs price (least squares), then +10%.
  catRates() {
    const st = this.state;
    const setup = st.type === 'delivery' ? 'delivery' : (st.layout === 'live' ? 'live' : 'buffet');
    const P = this.PRICES[st.cuisine][setup];
    const w = this.CAT_W, X = this.COMP.map((c) => c[0] * w[0] + c[1] * w[1] + c[2] * w[2] + c[3] * w[3]);
    const mx = X.reduce((a, b) => a + b, 0) / 4, my = P.reduce((a, b) => a + b, 0) / 4;
    let sxy = 0, sxx = 0;
    for (let k = 0; k < 4; k++) { sxy += (X[k] - mx) * (P[k] - my); sxx += (X[k] - mx) * (X[k] - mx); }
    const unit = sxy / sxx, base = Math.max(my - unit * mx, 0);
    const r = (v) => Math.round(Math.round(v * this.CUSTOM_MARKUP * 1e6) / 1e6 + 1e-9);
    return { base: r(base), starters: r(unit * w[0]), mains: r(unit * w[1]), staples: r(unit * w[2]), dessert: r(unit * w[3]) };
  }
  customPP(n) {
    const c = this.catRates();
    return c.base + n.starters * c.starters + n.mains * c.mains + n.staples * c.staples + n.dessert * c.dessert;
  }
  pkgVals() {
    const MIN = 2000;
    const st = this.state;
    const setup = st.type === 'delivery' ? 'delivery' : (st.layout === 'live' ? 'live' : 'buffet');
    const popular = (this.props.popular ?? 2) - 1;
    const pax = st.pax;
    const pv = st.pureVeg;
    const fmt = (n) => n.toLocaleString('en-US');

    const PRICES = this.PRICES;
    const TIERS = [
      { st: '1 Veg · 2 Non Veg', stv: '3 Veg', mc: '1 Veg · 1 Non Veg', mcv: '2 Veg', rice: 'Rice / Noodles', bir: 'Biryani / Breads', ds: '1 selection' },
      { st: '2 Veg · 2 Non Veg', stv: '4 Veg', mc: '2 Veg · 2 Non Veg', mcv: '4 Veg', rice: 'Rice / Noodles', bir: 'Biryani / Breads', ds: '2 selections' },
      { st: '2 Veg · 3 Non Veg', stv: '5 Veg', mc: '2 Veg · 3 Non Veg', mcv: '5 Veg', rice: 'Rice + Noodles', bir: 'Biryani + Breads', ds: '2 selections' },
      { st: '3 Veg · 3 Non Veg', stv: '6 Veg', mc: '3 Veg · 3 Non Veg', mcv: '6 Veg', rice: 'Rice + Noodles', bir: 'Biryani + Breads', ds: '2 selections' }

    const CUISINES = [

      { id: 'in', label: 'Indian', grow: 1 },

    const prices = PRICES[st.cuisine][setup];
    const sel = (on) => ({
      border: on ? '#C9963B' : '#E4D9C2',
      shadow: on ? '0 6px 16px rgba(201,150,59,0.35)' : '0 1px 2px rgba(14,59,51,0.06)'

    const pkgs = TIERS.map((t, i) => {
      const on = st.pkg === i;
      return Object.assign({
        name: 'Package ' + (i + 1),
        price: prices[i],
        popular: i === popular,
        on: on,
        pick: () => this.setState({ pkg: st.pkg === i ? null : i, consent: false, minWarn: false }),

          { k: 'Staples', v: t.rice + '\n' + t.bir },
          { k: 'Dessert', v: t.ds }
        ]
      }, sel(on));
    });

    const isCustom = st.pkg === 'custom';
    const hasPkg = typeof st.pkg === 'number';
    const price = hasPkg ? prices[st.pkg] : 0;
    const raw = price * pax;
    const belowMin = hasPkg && raw < MIN;
    const applied = belowMin && st.consent;
    let totalText = '—', totalSub = 'Pick a package to see the price', totalColor = '#0E3B33';
    if (isCustom) { totalText = 'Custom menu'; totalSub = 'Base ' + this.catRates().base + ' Dh + price of each dish you pick'; }
    if (hasPkg) {
      totalText = fmt(applied ? MIN : raw) + ' Dh';
      totalSub = applied ? 'Minimum applied (was ' + fmt(raw) + ' Dh)' : pax + ' guests × ' + price + ' Dh';
      if (belowMin && !st.consent) totalColor = st.minWarn ? '#B3261E' : '#8A3B12';
    }
    const ready = isCustom || hasPkg;

    return {
      cuisines: CUISINES.map((c) => {
        const on = st.cuisine === c.id;
        return {
          label: c.label, grow: c.grow, on: on,
          bg: on ? '#D3E7DE' : '#FFFFFF',
          color: '#0E3B33',
          border: on ? '#2F7A64' : '#DDD3BF',
          pick: () => this.setState({ cuisine: c.id, consent: false, minWarn: false })
        };
      }),
      pkgs: pkgs,
      custom: Object.assign({ on: isCustom, off: !isCustom, pick: () => this.setState({ pkg: isCustom ? null : 'custom', consent: false, minWarn: false }) }, sel(isCustom)),
      pax: pax,
      pkgCaption: pv ? 'Pure Veg menu · salads & sides incl.' : 'Salads & sides included',
      belowMin: belowMin,
      needPax: hasPkg ? Math.ceil(MIN / price) : pax,
      bumpPax: () => this.setState({ pax: Math.ceil(MIN / price), consent: false, minWarn: false }),
      consent: st.consent,
      toggleConsent: () => this.setState({ consent: !this.state.consent }),
      totalText: totalText,
      totalSub: totalSub,
      totalColor: totalColor,
      ready: ready,
      // under the minimum and not yet accepted: short hint under the total, and the main button accepts it
      // under the minimum: one line under the total; it turns red if Save & Next is tapped
      minOpen: belowMin && !st.minWarn && !st.consent,
      totalSubShown: !belowMin || !!st.consent,
      minHint: hasPkg ? 'Min. 2,000 Dh · Add ' + (Math.ceil(MIN / price) - pax) + (Math.ceil(MIN / price) - pax === 1 ? ' guest' : ' guests') : '',
      minHintColor: '#8A3B12',
      minWarnOn: false,

      minAddLabel: hasPkg ? 'Add ' + (Math.ceil(MIN / price) - pax) + (Math.ceil(MIN / price) - pax === 1 ? ' guest' : ' guests') : '',
      notReady: !ready,
      btnOpacity: 1
    };
  }

  itemsVals() {
    const st = this.state;
    const cuisine = st.cuisine;
    const tier = st.pkg === 'custom' ? 'custom' : String((typeof st.pkg === 'number' ? st.pkg : 1) + 1);
    const isCustom = tier === 'custom';
    const Q = this.Q;
    const pv = st.pureVeg;
    const q = isCustom ? null : Q[tier];
    const both = isCustom || tier === '3' || tier === '4';
    const cuLabel = { ic: 'Indian & Chinese', in: 'Indian', ch: 'Chinese' }[cuisine];
    const pool = this.ITEMS.filter((x) => (cuisine === 'ic' || x.cu === cuisine) && !(pv && x.diet === 'nonveg'));

    const DEFS = {
      starters: [
        { id: 'sv', title: 'Veg Starters', short: 'Veg', match: (x) => x.cat === 'starter' && x.diet === 'veg', need: q && (pv ? q.sv + q.snv : q.sv) },
        { id: 'snv', title: 'Non-Veg Starters', short: 'Non-Veg', match: (x) => x.cat === 'starter' && x.diet === 'nonveg', need: q && q.snv }
      ],
      mains: [
        { id: 'mv', title: 'Veg Main Course', short: 'Veg', match: (x) => x.cat === 'main' && x.diet === 'veg', need: q && (pv ? q.mv + q.mnv : q.mv) },
        { id: 'mnv', title: 'Non-Veg Main Course', short: 'Non-Veg', match: (x) => x.cat === 'main' && x.diet === 'nonveg', need: q && q.mnv }
      ],
      staples: [
        { id: 'rn', short: 'Rice / Noodles', title: both ? 'Rice & Noodles' : 'Rice or Noodles', match: (x) => x.cat === 'rice' || x.cat === 'noodle', need: q && q.rn },
        { id: 'bb', short: 'Biryani / Breads', title: both ? 'Biryani & Breads' : 'Biryani or Breads', match: (x) => x.cat === 'biryani' || x.cat === 'bread', need: q && q.bb }
      ],
      dessert: [
        { id: 'ds', title: 'Desserts', match: (x) => x.cat === 'dessert', need: q && q.ds }
      ]
    };
    const TABS = [
      { id: 'starters', label: 'Starters' },
      { id: 'mains', label: 'Mains' },
      { id: 'staples', label: 'Staples' },
      { id: 'dessert', label: 'Dessert' }
    ];

    const TILE = { iBowl: '#EEE0C4', iDump: '#F3E6C9', iRoll: '#E4EBD5', iSkew: '#F3DCCB', iBread: '#F1E3C0', iSweet: '#F3DCE0' };
    const iconOf = (x) => {
      if (x.cat === 'dessert') return 'iSweet';
      if (x.cat === 'bread') return 'iBread';
      if (x.sub.indexOf('Dim sum') === 0 || x.sub.indexOf('Bao') === 0) return 'iDump';
      if (x.sub.indexOf('Sushi') === 0 || x.sub.indexOf('Kathi') === 0) return 'iRoll';
      if (x.sub.indexOf('Tandoor') === 0) return 'iSkew';
      return 'iBowl';
    };

    // Build every group of every tab, with counts
    const built = {};
    let totalNeed = 0, totalDone = 0, totalPicked = 0;
    TABS.forEach((tb) => {
      built[tb.id] = [];
      DEFS[tb.id].forEach((d) => {
        const gp = pool.filter(d.match);
        if (!gp.length) return; // nothing on the menu for this cuisine
        const count = gp.filter((x) => st.sel[x.id]).length;
        const need = isCustom ? null : Math.min(d.need, gp.length);
        built[tb.id].push({ def: d, items: gp, count: count, need: need });
      });
    });

    const tabInfo = TABS.map((tb) => {
      const gs = built[tb.id];
      const need = gs.reduce((a, g) => a + (g.need || 0), 0);
      const done = gs.reduce((a, g) => a + (isCustom ? g.count : Math.min(g.count, g.need)), 0);
      totalNeed += need; totalDone += done;
      const complete = !isCustom && need > 0 && done >= need;
      return { tb: tb, need: need, done: done, complete: complete };
    });
    Object.keys(built).forEach((k) => built[k].forEach((g) => { totalPicked += g.count; }));

    const tabs = tabInfo.map((t) => {
      const on = st.tab === t.tb.id;
      return {
        label: t.tb.label, on: on,
        count: isCustom ? (t.done + ' picked') : (t.done + ' of ' + t.need),
        bg: on ? '#0E3B33' : '#FFFFFF',
        color: on ? '#FBF6EA' : '#0E3B33',
        subColor: on ? '#E9C77E' : (t.complete ? '#1F6B4E' : '#5A6863'),
        border: on ? '#0E3B33' : (t.complete ? '#2F7A64' : '#DDD3BF'),
        pick: () => { this._scrollTo = 'itemsTop'; this.setState({ tab: t.tb.id, sub: 0, note: '' }); }
      };
    });

    const showFilter = cuisine === 'ic';
    const filters = [['all', 'All'], ['in', 'Indian'], ['ch', 'Chinese']].map((f) => {
      const on = st.fcu === f[0];
      return {
        label: f[1], on: on,
        bg: on ? '#D3E7DE' : '#FFFFFF',
        border: on ? '#2F7A64' : '#DDD3BF',
        pick: () => this.setState({ fcu: f[0] })
      };
    });

    const tabGroups = built[st.tab] || [];
    const subIdx = Math.min(st.sub || 0, Math.max(tabGroups.length - 1, 0));
    const showSubs = tabGroups.length > 1;
    const subs = tabGroups.map((g, i) => {
      const on = i === subIdx;
      const done = !isCustom && g.count >= g.need;
      return {
        label: g.def.short,
        count: isCustom ? (g.count + ' picked') : (g.count + ' of ' + g.need),
        on: on,
        bg: on ? '#D3E7DE' : '#FFFFFF',
        border: on ? '#2F7A64' : (done ? '#2F7A64' : '#DDD3BF'),
        countColor: done ? '#1F6B4E' : '#5A6863',
        done: done,
        segBg: on ? '#FFFFFF' : 'transparent',
        segShadow: on ? '0 1px 3px rgba(14,59,51,0.18)' : 'none',
        pick: () => { this._scrollTo = 'itemsTop'; this.setState({ sub: i, note: '' }); }
      };
    });
    const shownGroups = showSubs ? [tabGroups[subIdx]] : tabGroups;
    const objById = {};
    const groups = shownGroups.map((g) => {
      const full = !isCustom && g.count >= g.need;
      const filtered = g.items.filter((x) => cuisine !== 'ic' || st.fcu === 'all' || x.cu === st.fcu);
      // the same dish can sit on both cuisine lists (e.g. Steamed Rice): show it once
      const shownNames = {};
      const visible = filtered.filter((x) => (shownNames[x.name] ? false : (shownNames[x.name] = true)));
      return {
        showHeader: !showSubs,
        title: g.def.title,
        pillText: isCustom ? (g.count + ' picked') : (g.count + ' of ' + g.need + (full ? ' - Done' : '')),
        pillBg: full ? '#D3E7DE' : '#EADFC8',
        pillColor: '#0E3B33',
        items: visible.map((x) => {
          const on = !!st.sel[x.id];
          const locked = !on && full;
          const icon = iconOf(x);
          const o = {
            name: x.name,
            caption: [cuisine === 'ic' ? (x.cu === 'in' ? 'Indian' : 'Chinese') : '', (pv ? (x.note || '').replace('Veg / Chicken / Prawns', 'Veg') : x.note) || x.sub, (pv && !x.diet && x.cat !== 'dessert') ? 'made Veg' : ''].filter(Boolean).join(' · '),
            tile: TILE[icon],
            hasDiet: !!x.diet,
            dietColor: x.diet === 'veg' ? '#2E7D32' : '#A8461B',
            on: on,
            locked: locked,
            opacity: locked ? 0.45 : 1,
            border: on ? '#C9963B' : '#E4D9C2',
            shadow: on ? '0 6px 16px rgba(201,150,59,0.35)' : '0 1px 2px rgba(14,59,51,0.06)',
            pick: () => {
              const sel = Object.assign({}, this.state.sel);
              const adding = !sel[x.id];
              if (adding) sel[x.id] = true; else delete sel[x.id];
              const extra = { note: '', minWarn: false, custMinOk: false };
              if (!adding) { const nn = Object.assign({}, this.state.notes); delete nn[x.id]; extra.notes = nn; }
              this.setState(Object.assign({ sel: sel }, extra));
              // group just filled: after a short pause (so the tick is seen) move on to what still needs items
              if (isCustom || !adding || g.items.filter((y) => sel[y.id]).length < g.need) return;
              const open = (h) => h.items.filter((y) => sel[y.id]).length < h.need;
              let move = null;
              const idx = tabGroups.findIndex((h, i) => i !== subIdx && open(h));
              if (idx >= 0) {
                move = { sub: idx, note: g.def.short + ' done. Now choose ' + tabGroups[idx].need + ' ' + tabGroups[idx].def.short + '.' };
              } else {
                const here = TABS.findIndex((t) => t.id === st.tab);
                const order = TABS.slice(here + 1).concat(TABS.slice(0, here));
                for (let k = 0; k < order.length && !move; k++) {
                  const gs = built[order[k].id];
                  const gi = gs.findIndex(open);
                  if (gi >= 0) move = { tab: order[k].id, sub: gi, note: TABS[here].label + ' done. Now choose ' + gs[gi].need + ' ' + gs[gi].def.title + '.' };
                }
                if (!move) move = { note: 'All dishes chosen. Tap Save & Next to continue.' };
              }
              clearTimeout(this._advanceTimer);
              this._advanceTimer = setTimeout(() => {
                if (this.state.screen !== 'items') return;
                // the dish may have been un-ticked during the pause: then stay put
                if (g.items.filter((y) => this.state.sel[y.id]).length < g.need) return;
                this._scrollTo = 'itemsTop';
                this.setState(move);
              }, 550);
            }
          };
          ['iBowl', 'iDump', 'iRoll', 'iSkew', 'iBread', 'iSweet'].forEach((k) => { o[k] = (k === icon); });
          // a real photo where we have one, otherwise the drawn icon
          const byCourse = window.DISH_PHOTOS_BY_COURSE || {};
          const shot = byCourse[x.name + '|' + x.cat + '|' + (x.diet || '')] ||
                       byCourse[x.name + '|' + x.cat] ||
                       (window.DISH_PHOTOS || {})[x.name];
          o.photo = shot ? 'images/web/' + shot + '.jpg' : '';
          o.hasPhoto = !!shot;
          o.noPhoto = !shot;
          o.zoom = () => this.setState({ zoom: x.id });
          const nt = (st.notes[x.id] || '').trim();
          o.hasNote = on && !!nt;
          o.noteText = nt;
          o.noteLabel = nt ? 'Edit note' : 'Add note';
          o.noteBg = nt ? '#F3D48F' : 'rgba(255,255,255,0.95)';
          o.openNote = () => this.setState({ noteFor: x.id, noteDraft: st.notes[x.id] || '' });
          objById[x.id] = o;
          return o;
        })
      };
    });

    const CHIPS = ['Extra spicy', 'Less spicy', 'Mild', 'No onion / garlic', 'Less oil', 'Extra gravy', 'Jain'];
    const nItem = st.noteFor ? this.ITEMS.find((y) => y.id === st.noteFor) : null;
    const draft = st.noteDraft || '';
    const noteChips = CHIPS.map((c) => {
      const has = draft.toLowerCase().indexOf(c.toLowerCase()) >= 0;
      return {
        label: c, on: has,
        bg: has ? '#D3E7DE' : '#FFFFFF', border: has ? '#2F7A64' : '#DDD3BF',
        pick: () => {
          const cur = this.state.noteDraft || '';
          const i = cur.toLowerCase().indexOf(c.toLowerCase());
          let next;
          if (i >= 0) next = (cur.slice(0, i) + cur.slice(i + c.length)).replace(/^[\s,]+|[\s,]+$/g, '').replace(/\s*,\s*,/g, ',');
          else next = cur.trim() ? cur.trim().replace(/[,\s]+$/, '') + ', ' + c : c;
          this.setState({ noteDraft: next });
        }
      };
    });
    const zo = st.zoom ? (objById[st.zoom] || null) : null;
    const zLabel = zo ? (zo.on ? 'Remove from my menu' : (zo.locked ? 'Limit reached for this group' : 'Add to my menu')) : '';
    const remaining = totalNeed - totalDone;
    const ready = isCustom ? totalPicked > 0 : remaining === 0;
    let hint, hintColor = '#5A6863';
    if (isCustom) {
      hint = totalPicked > 0 ? 'Add as many items as you like' : 'Pick the items you would like';
    } else if (ready) {
      hint = 'All items chosen - you are all set'; hintColor = '#1F6B4E';
    } else {
      hint = 'Choose ' + remaining + ' more item' + (remaining === 1 ? '' : 's') + ' to continue';
    }
    let custTotal = '', custSub = '', custPP = '', custSubColor = '#5A6863';
    let custBelowMin = false, custNeedPax = 0, custTotalColor = '#0E3B33';
    if (isCustom) {
      const fmt = (n) => n.toLocaleString('en-US');
      const pax = st.pax;
      if (!totalPicked) { custTotal = '-'; custPP = '-'; custSub = 'Pick dishes to see the approx. price'; }
      else {
        const pp = this.customPP({ starters: tabInfo[0].done, mains: tabInfo[1].done, staples: tabInfo[2].done, dessert: tabInfo[3].done });
        const raw = pp * pax;
        custPP = pp + ' Dh';
        custTotal = fmt(raw) + ' Dh';
        custSub = pax + ' guests × ' + pp + ' Dh · ' + totalPicked + ' dishes';
        if (raw < 2000) {
          custSub += ' — below the 2,000 Dh minimum'; custSubColor = '#8A5A00';
          custBelowMin = true; custNeedPax = Math.ceil(2000 / pp); custTotalColor = '#8A3B12';
        }
      }

  // ---------- everything the theme, review and PDF screens need ----------
  summary() {
    const st = this.state;

    const fmt = (n) => n.toLocaleString('en-US');
    const setup = st.type === 'delivery' ? 'delivery' : (st.layout === 'live' ? 'live' : 'buffet');
    const P = this.PRICES[st.cuisine][setup];

    const isCustom = st.pkg === 'custom', hasPkg = typeof st.pkg === 'number';
    const g = { starters: [], mains: [], staples: [], dessert: [] };
    this.ITEMS.forEach((x) => {
      if (!st.sel[x.id]) return;
      const k = x.cat === 'starter' ? 'starters' : x.cat === 'main' ? 'mains' : x.cat === 'dessert' ? 'dessert' : 'staples';
      const note = (st.notes[x.id] || '').trim();
      g[k].push({ name: x.name, note: note, hasNote: !!note });
    });

    let pp = 0;

    else if (isCustom) pp = this.customPP({ starters: g.starters.length, mains: g.mains.length, staples: g.staples.length, dessert: g.dessert.length });

    const th = this.THEMES.find((t) => t.id === st.theme) || null;

  buildPdf() {
    const S = this.summary();
    const W1 = [278, 278, 355, 556, 556, 889, 667, 191, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 278, 278, 584, 584, 584, 556, 1015, 667, 667, 722, 722, 667, 611, 778, 722, 278, 500, 667, 556, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 278, 278, 278, 469, 556, 333, 556, 556, 500, 556, 556, 278, 556, 556, 222, 222, 500, 222, 833, 556, 556, 556, 556, 333, 500, 278, 556, 500, 722, 500, 500, 500, 334, 260, 334, 584], W2 = [278, 333, 474, 556, 556, 889, 722, 238, 333, 333, 389, 584, 278, 333, 278, 278, 556, 556, 556, 556, 556, 556, 556, 556, 556, 556, 333, 333, 584, 584, 584, 611, 975, 722, 722, 722, 722, 667, 611, 778, 722, 278, 556, 722, 611, 833, 722, 778, 667, 778, 722, 667, 611, 722, 667, 944, 667, 667, 611, 333, 278, 333, 584, 556, 333, 556, 611, 556, 611, 556, 333, 611, 611, 278, 278, 556, 278, 889, 611, 611, 611, 611, 389, 556, 333, 611, 556, 778, 556, 556, 500, 389, 280, 389, 584];
    const wOf = (t, size, bold) => { const tb = bold ? W2 : W1; let w = 0; for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i) - 32; w += (c >= 0 && c < 95 ? tb[c] : 556); } return w * size / 1000; };

    const rtext = (xr, yb, t, size, bold, hex) => text(xr - wOf(clean(t), size, bold), yb, t, size, bold, hex);

    const kv = (k, v) => {

    section('Customer details');
    kv('Name', S.name); kv('Contact', S.contact); kv('Emirates', S.emirate); kv('Event date & time', S.when); kv('Guests', S.pax); kv('Pure Veg', S.veg);
    y += 8; section('Setup');
    kv('Catering type', S.typeLabel);
    if (S.isOnsite) { kv('Layout', S.layoutLabel); kv('Venue', S.venueLabel); }
    y += 8; section('Menu');
    kv('Selection', S.pkgLabel); kv('Cuisine', S.cuisine); kv('Price per person', S.ppText);
    y += 4;
    S.groups.forEach((gr) => {

      gr.items.forEach((d) => {

        ensure(l1.length * 14 + ln.length * 13 + 4);

        l1.forEach((l, i) => text(M + 16, y + i * 14, l, 11, false, '#1B2B27'));

        y += ln.length * 13 + 3;

    y += 4; section('Theme & notes');
    kv('Theme', S.themeLabel); kv('Notes', S.notesText);
    y += 8; ensure(150);
    section('Price summary');
    const row = (a, b, bold, hex) => { ensure(20); text(M, y, a, 11, bold, hex || '#1B2B27'); rtext(PW - M, y, b, 11, bold, hex || '#1B2B27'); y += 19; };

    row(S.themeRowLabel, S.themeRowValue, false);
    y += 4; ensure(50);

    wrap('This is an approximate price. The final quote is confirmed by our team after review.', CW, 9.5, false).forEach((l, i) => text(M, y + i * 12, l, 9.5, false, '#5A6863'));
    if (ops.length) pages.push(ops);
    const total = pages.length;
    pages.forEach((p, i) => {
      const save = ops; ops = p;
      rect(M, PH - 40, CW, 0.8, '#DDD3BF');
      text(M, PH - 26, 'Build your Menu! - Ref ' + S.ref, 9, false, '#5A6863');
      rtext(PW - M, PH - 26, 'Page ' + (i + 1) + ' of ' + total, 9, false, '#5A6863');
      ops = save;
    });
    let out = '%PDF-1.4\n'; const offs = [];
    const add = (body) => { offs.push(out.length); out += offs.length + ' 0 obj\n' + body + '\nendobj\n'; };
    add('<< /Type /Catalog /Pages 2 0 R >>');
    add('<< /Type /Pages /Kids [' + pages.map((_, i) => (6 + i * 2) + ' 0 R').join(' ') + '] /Count ' + total + ' >>');
    add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    pages.forEach((p, i) => {
      const body = p.join('\n');
      add('<< /Length ' + body.length + ' >>\nstream\n' + body + '\nendstream');
      add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (5 + i * 2) + ' 0 R >>');
    });
    const xr = out.length;
    out += 'xref\n0 ' + (offs.length + 1) + '\n0000000000 65535 f \n' + offs.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    out += 'trailer\n<< /Size ' + (offs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF';
    const u8 = new Uint8Array(out.length);

    return new Blob([u8], { type: 'application/pdf' });
  }
  // The order number comes from the database, so the run is unbroken and no two
  // customers can be given the same one. Asking twice returns the same number.
  async ensureRef() {
    if (/^CO-/.test(this.REF)) return this.REF;
    const cfg = window.BYM_CONFIG || {};
    const sid = window.BYM_SESSION;
    if (!cfg.tracking || !cfg.supabaseUrl || !cfg.anonKey || !sid) return this.REF;
    try {
      const res = await fetch(cfg.supabaseUrl + '/rest/v1/rpc/assign_order_ref', {
        method: 'POST',
        headers: {
          apikey: cfg.anonKey,
          Authorization: 'Bearer ' + cfg.anonKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_session: sid })
      });
      if (res.ok) {
        const v = await res.json();
        if (typeof v === 'string' && v) this.REF = v;
      }
    } catch (e) { /* offline: keep the local number rather than block the order */ }
    return this.REF;
  }
  async downloadPdf() {
    this.setState({ pdfMsg: 'Confirming and preparing your PDF...' });
    await this.ensureRef();                 // must happen before the PDF is drawn
    const filename = 'Catering-Order-' + this.REF + '.pdf';
    let blob;
    try { blob = this.buildPdf(); } catch (e) { this.setState({ pdfMsg: 'Could not create the PDF. Please try again.' }); return; }
    let dl = null;
    try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    try {
      if (dl) {
        await dl.save({ filename: filename, data: blob });
        this.setState({ screen: 'thanks', pdfMsg: '' });
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        this.setState({ screen: 'thanks', pdfMsg: '' });
      }
    } catch (e) {
      this.setState({ pdfMsg: (e && e.code === 'declined') ? 'Not confirmed yet - download was cancelled' : 'Download was blocked here. Please open the link in your browser and try again.' });
    }
  }

      nextFromDetails: () => {
        const missing = [];
        if (!(st.name || '').trim()) missing.push('name');
        if (!(st.phone || '').trim()) missing.push('contact number');
        if (!st.date) missing.push('event date');
        if (!(st.pax > 0)) missing.push('number of guests');
        if (missing.length) { this.setState({ detailsWarn: true }); return; }
        go(ret ? 'review' : 'setup', true);
      },
      backSetup: () => go(ret ? 'review' : 'details', true),
      nextFromSetup: () => go(ret ? 'review' : 'pkg', true),
      backPkg: () => go(ret ? 'review' : 'setup', true),
      nextFromPkg: () => {
        if (this.pkgVals().belowMin && !st.consent) { this.setState({ minWarn: true }); return; }
        openItems();
      },
      backItems: () => go(ret ? 'review' : 'pkg', true),
      nextFromItems: () => {
        if (this.itemsVals().custBelowMin && !st.custMinOk) { this.setState({ minWarn: true }); return; }
        go(ret ? 'review' : 'theme', true);
      },
      backTheme: () => go(ret ? 'review' : 'items', true),
      nextFromTheme: () => go('review', true),
      backReview: () => go('theme', true),
      editDetails: () => go('details', false, true),
      editSetup: () => go('setup', false, true),
      editPkg: () => go('pkg', false, true),
      editItems: () => openItems(true),
      editTheme: () => go('theme', false, true),
      themes: themes,
      d: dObj,
      isThemeDetail: screen === 'themeDetail',
      closeThemeDetail: () => this.setState({ screen: 'theme' }),
      eventNote: st.eventNote,
      setEventNote: (e) => this.setState({ eventNote: String(e.target.value).slice(0, 500) }),
      themeSumText: S.th ? S.th.name + (S.th.price ? ' · + ' + S.fmt(S.th.price) + ' Dh' : ' · Free') : 'None selected',
      grandText: S.grandNum > 0 ? S.grand : '-',
      rv: S,
      hasPdfMsg: !!st.pdfMsg,
      pdfMsg: st.pdfMsg,
      downloadPdf: () => this.downloadPdf(),
      // details
      name: st.name, cc: st.cc, phone: st.phone, emirate: st.emirate, date: st.date, time: st.time,
      dWarn: !!st.detailsWarn,
      dNameBorder:  (st.detailsWarn && !(st.name || '').trim()) ? '#B3261E' : '#DDD3BF',
      dPhoneBorder: (st.detailsWarn && !(st.phone || '').trim()) ? '#B3261E' : '#DDD3BF',
      dDateBorder:  (st.detailsWarn && !st.date) ? '#B3261E' : '#DDD3BF',
      dWarnText: (() => {
        const m = [];
        if (!(st.name || '').trim()) m.push('name');
        if (!(st.phone || '').trim()) m.push('contact number');
        if (!st.date) m.push('event date');
        if (!(st.pax > 0)) m.push('guests');
        if (!m.length) return '';
        return 'Please add your ' + (m.length === 1 ? m[0] : m.slice(0, -1).join(', ') + ' and ' + m[m.length - 1]) + '.';
      })(),
      dWarnShown: !!st.detailsWarn && !!((!(st.name || '').trim()) || (!(st.phone || '').trim()) || !st.date || !(st.pax > 0)),
      dConsentShown: !(!!st.detailsWarn && !!((!(st.name || '').trim()) || (!(st.phone || '').trim()) || !st.date || !(st.pax > 0))),
      setName: (e) => this.setState({ name: e.target.value }),
      setCc: (e) => this.setState({ cc: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setEmirate: (e) => this.setState({ emirate: e.target.value }),
      setDate: (e) => this.setState({ date: e.target.value }),
      dateEmpty: !st.date,
      setTime: (e) => this.setState({ time: e.target.value }),
      paxText: st.paxEdit !== null ? st.paxEdit : String(pax),
      typePax: (e) => {
        const d = String(e.target.value).replace(/[^0-9]/g, '').slice(0, 4);
        const n = parseInt(d, 10);
        this.setState({ paxEdit: d, pax: n > 0 ? Math.min(n, 5000) : pax, consent: false });
      },
      blurPax: () => this.setState({ paxEdit: null }),
      incPax: () => this.setState({ pax: Math.min(pax + 1, 5000), paxEdit: null, consent: false, minWarn: false }),
      decPax: () => this.setState({ pax: Math.max(pax - 1, 1), paxEdit: null, consent: false, minWarn: false }),
      pvYes: pvOpt(st.pureVeg, true),
      pvNo: pvOpt(!st.pureVeg, false),
      // setup
      isOnsite: isOnsite,
      showVenue: isOnsite && !!st.layout,
      sReady: sReady,
      sNotReady: !sReady,
      delivery: opt(st.type === 'delivery', () => this.setState({ type: 'delivery', layout: null, venue: null, consent: false })),
      onsite: opt(isOnsite, () => { this._scrollTo = 'layout'; this.setState({ type: 'onsite', consent: false }); }),
      buffet: opt(st.layout === 'buffet', () => { this._scrollTo = 'venue'; this.setState({ layout: 'buffet', consent: false }); }),
      live: opt(st.layout === 'live', () => { this._scrollTo = 'venue'; this.setState({ layout: 'live', consent: false }); }),
      indoor: opt(st.venue === 'indoor', () => this.setState({ venue: 'indoor' })),
      outdoor: opt(st.venue === 'outdoor', () => this.setState({ venue: 'outdoor' }))
    }, this.pkgVals(), this.itemsVals());
  }
}
</script>
<script>
window.__dcMount(Component, { start: 'details', popular: 2 }, 'tpl', 'app');
/* ------------------------------------------------------------------
   Sends visits and leads to Supabase.

   Rules this file lives by:
     - it never interferes with the booking flow. Every call is wrapped,
       fire-and-forget, and a failure is silent to the customer;
     - it only writes. It cannot read anyone's data back;
     - with BYM_CONFIG.tracking = false it does nothing at all.
   ------------------------------------------------------------------ */
(function () {
  'use strict';

  var cfg = window.BYM_CONFIG || {};
  if (!cfg.tracking || !cfg.supabaseUrl || !cfg.anonKey) return;

  var RPC = cfg.supabaseUrl + '/rest/v1/rpc/';
  var SEND_AFTER_MS = 1500;   // wait for the customer to stop fiddling before saving

  /* ---------- who this browser is (random, meaningless on its own) ---------- */
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
    });
  }
  var sid;
  try {
    sid = localStorage.getItem('bym_sid');
    if (!sid) { sid = uuid(); localStorage.setItem('bym_sid', sid); }
  } catch (e) { sid = uuid(); }   // private window, blocked storage: still works, just not remembered

  // the app asks the database for the order number using this
  window.BYM_SESSION = sid;

  function post(fn, body) {
    try {
      var url = RPC + fn;
      var payload = JSON.stringify(body);
      var headers = {
        'apikey': cfg.anonKey,
        'Authorization': 'Bearer ' + cfg.anonKey,
        'Content-Type': 'application/json'
      };
      // keepalive lets the request finish even if the page is closing.
      // (sendBeacon cannot carry the auth headers Supabase needs, so it is not used.)
      fetch(url, { method: 'POST', headers: headers, body: payload, keepalive: true })
        .catch(function () {});
    } catch (e) { /* never let tracking break the page */ }
  }

  /* ---------- the link was opened ---------- */
  function linkToken() {
    try {
      var p = new URLSearchParams(location.search);
      return p.get('t') || p.get('token') || '';
    } catch (e) { return ''; }
  }
  function source() {
    try {
      var p = new URLSearchParams(location.search);
      var s = p.get('src') || p.get('utm_source') || '';
      if (s) return s;
      if (document.referrer) return document.referrer.slice(0, 180);
      return 'direct';
    } catch (e) { return ''; }
  }
  function device() {
    var ua = navigator.userAgent || '';
    if (/iPad|Tablet/i.test(ua)) return 'iPad';
    if (/iPhone/i.test(ua)) return 'iPhone';
    if (/Android/i.test(ua)) return 'Android';
    if (/Windows/i.test(ua)) return 'Windows';
    if (/Mac OS/i.test(ua)) return 'Mac';
    return 'Other';
  }

  post('track_visit', {
    p_session: sid,
    p_meta: { token: linkToken(), source: source(), device: device(), ua: (navigator.userAgent || '').slice(0, 280) }
  });

  /* ---------- what the customer has filled in so far ---------- */
  function names(inst, ids) {
    var out = [];
    try {
      for (var i = 0; i < inst.ITEMS.length; i++) {
        if (ids[inst.ITEMS[i].id]) out.push(inst.ITEMS[i].name);
      }
    } catch (e) {}
    return out;
  }

  /* Everything the order sheet needs, rebuilt later in the owner's panel.
     Dishes are stored by name and course, not by their position in the menu,
     so an order still reads correctly after dishes are added or removed. */
  function picked(inst) {
    var out = [], st = inst.state;
    try {
      for (var i = 0; i < inst.ITEMS.length; i++) {
        var x = inst.ITEMS[i];
        if (st.sel[x.id]) out.push({ name: x.name, cat: x.cat, note: (st.notes[x.id] || '').trim() });
      }
    } catch (e) {}
    return out;
  }

  function choices(st) {
    return {
      name: st.name || '', cc: st.cc || '+971', phone: st.phone || '',
      emirate: st.emirate || '', date: st.date || '', time: st.time || '',
      pax: st.pax, pureVeg: !!st.pureVeg,
      type: st.type || null, layout: st.layout || null, venue: st.venue || null,
      cuisine: st.cuisine || 'ic',
      pkg: (st.pkg === undefined ? null : st.pkg),
      theme: st.theme || null, eventNote: st.eventNote || ''
    };
  }

  function snapshot(inst) {
    var st = inst.state;
    var screen = st.screen || 'details';
    var done = (screen === 'thanks');
    var s = null;
    try { s = inst.summary(); } catch (e) {}

    return {
      name: st.name || '',
      phone: (st.name || st.phone) ? ((st.cc || '') + ' ' + (st.phone || '')).trim() : '',
      emirate: st.emirate || '',
      date: st.date || '',
      time: st.time || '',
      pax: st.pax ? String(st.pax) : '',
      pure_veg: !!st.pureVeg,
      step: screen,
      status: done ? 'completed' : 'started',
      // only a confirmed order carries a number, so the CO- run has no gaps
      ref: done && s ? (s.ref || '') : '',
      token: linkToken(),
      details: {
        setup: { type: st.type || null, layout: st.layout || null, venue: st.venue || null },
        menu: {
          cuisine: st.cuisine || null,
          package: (st.pkg === 'custom') ? 'custom' : (typeof st.pkg === 'number' ? st.pkg + 1 : null),
          dishes: names(inst, st.sel || {}),
          notes: st.notes || {}
        },
        theme: st.theme || null,
        eventNote: st.eventNote || '',
        totals: s ? { perPerson: s.ppText, menuTotal: s.menuTotal, grand: s.grandNum, grandText: s.grand } : null,
        order: { choices: choices(st), picked: picked(inst) }
      }
    };
  }

  /* ---------- save when something meaningful changes ---------- */
  var timer = null, lastSent = '';

  function maybeSend(force) {
    var inst = window.__dcInstance;
    if (!inst || !inst.state) return;
    var st = inst.state;
    // nothing is stored until page 1 is done: no name and number, no lead
    if (!st.name || !st.phone) return;

    var data = snapshot(inst);
    var sig = JSON.stringify(data);
    if (sig === lastSent) return;

    clearTimeout(timer);
    var go = function () { lastSent = sig; post('track_lead', { p_session: sid, p_data: data }); };
    if (force) go(); else timer = setTimeout(go, SEND_AFTER_MS);
  }

  var seen = '';
  setInterval(function () {
    var inst = window.__dcInstance;
    if (!inst || !inst.state) return;
    var st = inst.state;
    var quick = [st.screen, st.name, st.phone, st.emirate, st.date, st.time, st.pax, st.pureVeg,
                 st.type, st.layout, st.venue, st.cuisine, st.pkg, st.theme,
                 Object.keys(st.sel || {}).length, st.eventNote].join('|');
    if (quick === seen) return;
    seen = quick;
    maybeSend(st.screen === 'thanks');
  }, 700);

  // last chance to save when the customer leaves or hides the page
  addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') maybeSend(true);
  });
  addEventListener('pagehide', function () { maybeSend(true); });
})();
</script>
