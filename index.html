    };
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">' +
      '<rect width="160" height="100" fill="' + bg + '"/>' + top + (BODY[id] || '') + '</svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }
  /* Which drawn icon a set-menu item gets, and the tile colour behind it,
     matching the dish tiles so the two screens look like one app. Chosen from
     the item's own name first, then from the section it sits in. */
  setIcon(name, section) {
    const n = (name || '').toLowerCase(), sc = (section || '').toLowerCase();
    const pick = (k) => ({
      sCup: k === 'cup', sBread: k === 'bread', sRoll: k === 'roll',
      sSkew: k === 'skew', sSweet: k === 'sweet', sBowl: k === 'bowl',
      tile: { cup: '#E7E3D2', bread: '#F1E3C0', roll: '#E4EBD5',
              skew: '#F3DCCB', sweet: '#F3DCE0', bowl: '#EEE0C4' }[k]
    });
    // the section wins for drinks: "English Breakfast" is a tea, and nothing
    // in its own name says so
    if (/tea|coffee/.test(sc)) return pick('cup');
    if (/tea|coffee|chai/.test(n)) return pick('cup');
    if (/roll|wrap|spring/.test(n) && !/chocolate/.test(n)) return pick('roll');
    if (/wing|tikka|kibbeh|kebab/.test(n)) return pick('skew');
    if (/sandwich|slider|croissant|bread|kulcha|roti/.test(n)) return pick('bread');
    if (/cookie|biscuit|pastry|cake|brownie|chocolate/.test(n)) return pick('sweet');
    if (/cookie|biscuit|pastr|cake/.test(sc)) return pick('sweet');
    if (/croissant|sandwich/.test(sc)) return pick('bread');
    return pick('bowl');
  }
  // a menu whose items are chosen from its own lists, not from the 147 dishes
  pickMenu(cu) {
    const m = (this.PICK_MENUS || {})[cu || this.state.cuisine];
    return m && m.packages && m.packages.length ? m : null;
  }
  /* The items of the chosen pick-menu package, shaped like dishes so the
     choosing screen, the counts and the order sheet all work unchanged.
     One synthetic category per section. */
  pickPool() {
    const st = this.state;
    const m = this.pickMenu(st.cuisine);
    const pk = (m && typeof st.pkg === 'number') ? m.packages[st.pkg] : null;
    if (!pk) return null;
    const out = [];
    pk.sections.forEach((sec, si) => {
      sec.items.forEach((n, ni) => {
        out.push({ id: 'p' + si + '_' + ni, name: n, cat: 'sec' + si,
                   cu: st.cuisine, diet: null, sub: sec.title, note: '' });
      });
    });
    return { pack: pk, items: out };
  }
  // the set menu for this cuisine, or null when it picks dishes the usual way
  setMenu(cu) {
    const m = (this.SET_MENUS || {})[cu || this.state.cuisine];
    return m && m.packages && m.packages.length ? m : null;
  }
  // a live station means there are counters to choose
  hasCounters() {
    const l = this.state.layout;
    return this.state.type === 'onsite' && (l === 'live' || l === 'both');
  }
  pickedCounters() {
    const on = this.state.counters || {};
    const out = [];
    this.COUNTERS.forEach((g) => g.items.forEach((c) => { if (on[c.id]) out.push(c.name); }));
    return out;
  }
  typeLabelOf(t) {
    return t === 'delivery' ? 'Delivery' : (t === 'onsite' ? 'Onsite Catering' : '');
  }
  layoutLabelOf(l) {
    return l === 'live' ? 'Live Cooking Station'
         : (l === 'both' ? 'Buffet + Live Station'
         : (l === 'buffet' ? 'Buffet' : ''));
  }
  renderVals() {
    const st = this.state;
    const screen = st.screen || this.props.start || 'details';
    const isOnsite = st.type === 'onsite';
    const sReady = st.type === 'delivery' || (isOnsite && !!st.layout && !!st.venue);
    // a question is open while it has no answer, or while the pencil is on it
    const edit = st.setupEdit || null;
    const nCounters = Object.keys(st.counters || {}).length;
    const typeOpen = !st.type || edit === 'type';
    const layoutOpen = !typeOpen && (!st.layout || edit === 'layout');
    const venueOpen = !typeOpen && !layoutOpen && (!st.venue || edit === 'venue');
    const opt = (on, pick) => ({
      on: on, pick: pick,
      border: on ? '#C9963B' : '#E4D9C2',
      shadow: on ? '0 6px 16px rgba(201,150,59,0.35)' : '0 1px 2px rgba(14,59,51,0.06)'
    });
    const pvOpt = (on, val) => ({
      on: on,
      pick: () => this.setState({ pureVeg: val }),
      bg: on ? '#0E3B33' : '#FFFFFF',
      color: on ? '#FBF6EA' : '#0E3B33',
      border: on ? '#0E3B33' : '#DDD3BF'
    });
    const pax = st.pax;
    const ret = st.returnTo;
    const go = (scr, clearRet, setRet) => this.setState({ screen: scr, returnTo: setRet ? 'review' : (clearRet && scr === 'review' ? null : st.returnTo), pdfMsg: '' });
    const openItems = (fromReview) => {
      const key = st.cuisine + '|' + st.pkg + '|' + (st.pureVeg ? 'pv' : 'all');
      const pmOpen = this.pickMenu(st.cuisine);
      const firstTab = pmOpen ? 'sec0' : 'starters';
      this.setState({ screen: 'items', minWarn: false, returnTo: fromReview ? 'review' : st.returnTo, tab: firstTab, fcu: 'all', sub: 0, note: '', sel: st.selKey === key ? st.sel : {}, notes: st.selKey === key ? st.notes : {}, noteFor: null, zoom: null, selKey: key });
    };
    const S = this.summary();
    const themes = this.THEMES.map((t) => {
      const on = st.theme === t.id, free = t.price === 0;
      return {
        name: t.name, desc: t.desc, c1: t.c[0], c2: t.c[1], c3: t.c[2], c4: t.c[3],
        k1: t.id === 't1', k2: t.id === 't2', k3: t.id === 't3', k4: t.id === 't4', k5: t.id === 't5', k6: t.id === 't6',
        tag: free ? 'FREE' : 'PREMIUM', tagBg: free ? '#D3E7DE' : '#C9963B', tagColor: '#0E3B33',
        priceText: free ? 'Free' : '+ ' + S.fmt(t.price) + ' Dh',
        priceColor: free ? '#1F6B4E' : '#8A5A00',
        on: on, border: on ? '#C9963B' : '#E4D9C2',
        shadow: on ? '0 6px 16px rgba(201,150,59,0.35)' : '0 1px 2px rgba(14,59,51,0.06)',
        pick: () => this.setState({ theme: on ? null : t.id }),
        open: () => this.setState({ screen: 'themeDetail', themeView: t.id })
      };
    });
    const dt = this.THEMES.find((t) => t.id === st.themeView) || this.THEMES[3];
    const di = this.THEME_INFO[dt.id];
    const dOn = st.theme === dt.id, dFree = dt.price === 0;
    const dObj = {
      name: dt.name, c1: dt.c[0], c2: dt.c[1], c3: dt.c[2], c4: dt.c[3],
      k1: dt.id === 't1', k2: dt.id === 't2', k3: dt.id === 't3', k4: dt.id === 't4', k5: dt.id === 't5', k6: dt.id === 't6',
      tag: dFree ? 'FREE WITH PACKAGE' : 'PREMIUM', tagBg: dFree ? '#D3E7DE' : '#C9963B', tagColor: '#0E3B33',
      priceLong: dFree ? 'Free with your package' : '+ ' + S.fmt(dt.price) + ' Dh per event',
      priceColor: dFree ? '#1F6B4E' : '#8A5A00',
      priceNote: dFree ? 'Included with your package at no extra charge.' : 'Premium theme: a flat charge per event, added to your approx. total. Final price is confirmed by our team.',
      long: di.long, incl: di.incl.map((x) => ({ text: x })), best: di.best.map((x) => ({ text: x })),
      btnLabel: dOn ? 'Selected - tap to remove' : (dFree ? 'Select this theme' : 'Select theme · + ' + S.fmt(dt.price) + ' Dh'),
      btnBg: dOn ? '#FFFFFF' : '#0E3B33', btnColor: dOn ? '#0E3B33' : '#FBF6EA', btnBorder: dOn ? '1.5px solid #0E3B33' : 'none',
      choose: () => this.setState({ theme: dOn ? null : dt.id, screen: 'theme' })
    };
    return Object.assign({
      isDetails: screen === 'details',
      isSetup: screen === 'setup',
      isPkgScreen: screen === 'pkg',
      isItemsScreen: screen === 'items',
      isThemeScreen: screen === 'theme',
      isReviewScreen: screen === 'review',
      isThanks: screen === 'thanks',
      thanksTitle: (st.name || '').trim() ? 'Thank you, ' + st.name.trim().split(/\s+/)[0] + '!' : 'Thank you!',
      backToReview: () => this.setState({ screen: 'review', pdfMsg: '' }),
      // navigation: while editing from the review page, every "Save & Next" / Back returns there
      nextFromDetails: () => {
        const missing = [];
        if (!(st.name || '').trim()) missing.push('name');
        if (!(st.phone || '').trim()) missing.push('contact number');
        if (!st.date) missing.push('event date');
        if (!(st.pax > 0)) missing.push('number of guests');
        if (missing.length) { this.setState({ detailsWarn: true }); return; }
        go(ret ? 'review' : 'setup', true);
      },
      backSetup: () => go(ret ? 'review' : 'details', true),
      nextFromSetup: () => go(ret ? 'review' : (this.hasCounters() ? 'counters' : 'pkg'), true),
      backCounters: () => go(ret ? 'review' : 'setup', true),
      nextFromCounters: () => go(ret ? 'review' : 'pkg', true),
      backPkg: () => go(ret ? 'review' : (this.hasCounters() ? 'counters' : 'setup'), true),
      nextFromPkg: () => {
        if (this.pkgVals().belowMin && !st.consent) { this.setState({ minWarn: true }); return; }
        openItems();
      },
      backItems: () => go(ret ? 'review' : 'pkg', true),
      nextFromItems: () => {
        if (this.itemsVals().custBelowMin && !st.custMinOk) { this.setState({ minWarn: true }); return; }
        go(ret ? 'review' : 'theme', true);
      },
      backTheme: () => go(ret ? 'review' : 'items', true),
      nextFromTheme: () => go('review', true),
      backReview: () => go('theme', true),
      editDetails: () => go('details', false, true),
      editSetup: () => go('setup', false, true),
      editPkg: () => go('pkg', false, true),
      editItems: () => openItems(true),
      editTheme: () => go('theme', false, true),
      themes: themes,
      d: dObj,
      isThemeDetail: screen === 'themeDetail',
      closeThemeDetail: () => this.setState({ screen: 'theme' }),
      eventNote: st.eventNote,
      setEventNote: (e) => this.setState({ eventNote: String(e.target.value).slice(0, 500) }),
      themeSumText: S.th ? S.th.name + (S.th.price ? ' · + ' + S.fmt(S.th.price) + ' Dh' : ' · Free') : 'None selected',
      grandText: (S.grandNum > 0 || !this.priced()) ? S.grand : '-',
      rv: S,
      hasPdfMsg: !!st.pdfMsg,
      pdfMsg: st.pdfMsg,
      downloadPdf: () => this.downloadPdf(),
      // details
      name: st.name, cc: st.cc, phone: st.phone, emirate: st.emirate, date: st.date, time: st.time,
      dWarn: !!st.detailsWarn,
      dNameBorder:  (st.detailsWarn && !(st.name || '').trim()) ? '#B3261E' : '#DDD3BF',
      dPhoneBorder: (st.detailsWarn && !(st.phone || '').trim()) ? '#B3261E' : '#DDD3BF',
      dDateBorder:  (st.detailsWarn && !st.date) ? '#B3261E' : '#DDD3BF',
      dWarnText: (() => {
        const m = [];
        if (!(st.name || '').trim()) m.push('name');
        if (!(st.phone || '').trim()) m.push('contact number');
        if (!st.date) m.push('event date');
        if (!(st.pax > 0)) m.push('guests');
        if (!m.length) return '';
        return 'Please add your ' + (m.length === 1 ? m[0] : m.slice(0, -1).join(', ') + ' and ' + m[m.length - 1]) + '.';
      })(),
      dWarnShown: !!st.detailsWarn && !!((!(st.name || '').trim()) || (!(st.phone || '').trim()) || !st.date || !(st.pax > 0)),
      dConsentShown: !(!!st.detailsWarn && !!((!(st.name || '').trim()) || (!(st.phone || '').trim()) || !st.date || !(st.pax > 0))),
      setName: (e) => this.setState({ name: e.target.value }),
      setCc: (e) => this.setState({ cc: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setEmirate: (e) => this.setState({ emirate: e.target.value }),
      setDate: (e) => this.setState({ date: e.target.value }),
      dateEmpty: !st.date,
      setTime: (e) => this.setState({ time: e.target.value }),
      paxText: st.paxEdit !== null ? st.paxEdit : String(pax),
      typePax: (e) => {
        const d = String(e.target.value).replace(/[^0-9]/g, '').slice(0, 4);
        const n = parseInt(d, 10);
        this.setState({ paxEdit: d, pax: n > 0 ? Math.min(n, 5000) : pax, consent: false });
      },
      blurPax: () => this.setState({ paxEdit: null }),
      incPax: () => this.setState({ pax: Math.min(pax + 1, 5000), paxEdit: null, consent: false, minWarn: false }),
      decPax: () => this.setState({ pax: Math.max(pax - 1, 1), paxEdit: null, consent: false, minWarn: false }),
      pvYes: pvOpt(st.pureVeg, true),
      pvNo: pvOpt(!st.pureVeg, false),
      // setup
      isOnsite: isOnsite,
      showVenue: isOnsite && !!st.layout,
      sReady: sReady,
      sNotReady: !sReady,
      // Each question folds into one line once it is answered, so only the
      // question still being asked takes up the screen. The pencil opens it
      // again without losing the answer.
      // every question answered and folded away: nothing left but to go on.
      // Delivery asks no layout or venue, so those only count when onsite.
      setupDone: sReady && !typeOpen &&
                 !(isOnsite && layoutOpen) && !(isOnsite && venueOpen),
      isSetItems: !!(this.setMenu(st.cuisine) && typeof st.pkg === 'number'),
      setMenuName: (() => {
        const m = this.setMenu(st.cuisine);
        return (m && typeof st.pkg === 'number' && m.packages[st.pkg]) ? m.packages[st.pkg].name : '';
      })(),
      setSections: (() => {
        const m = this.setMenu(st.cuisine);
        const pk = (m && typeof st.pkg === 'number') ? m.packages[st.pkg] : null;
        if (!pk) return [];
        return pk.sections.map((sec) => ({
          title: sec.title,
          items: sec.items.map((n) => Object.assign({ name: n }, this.setIcon(n, sec.title)))
        }));
      })(),
      isCounters: screen === 'counters',
      counterGroups: this.COUNTERS.map((g) => ({
        group: g.group,
        items: g.items.map((c) => {
          const on = !!(st.counters || {})[c.id];
          return {
            name: c.name, on: on,
            art: this.counterPhoto(c.id) || this.counterArt(c.id, g.bg),
            border: on ? '#C9963B' : '#E4D9C2',
            bg: on ? '#FDF7EA' : '#FFFFFF',
            nameColor: on ? '#6A4E12' : '#0E3B33',
            shadow: on ? '0 6px 16px rgba(201,150,59,0.35)' : '0 1px 2px rgba(14,59,51,0.06)',
            pick: () => {
              const n = Object.assign({}, this.state.counters);
              if (n[c.id]) delete n[c.id]; else n[c.id] = true;
              this.setState({ counters: n });
            }
          };
        })
      })),
      countersPicked: nCounters,
      countersCount: nCounters === 0 ? 'None chosen yet'
        : nCounters + (nCounters === 1 ? ' counter chosen' : ' counters chosen'),
      cReady: nCounters > 0,
      cNotReady: nCounters === 0,
      typeOpen: typeOpen,
      typeDone: !typeOpen && !!st.type,
      typeLine: this.typeLabelOf(st.type),
      editType: () => this.setState({ setupEdit: 'type' }),
      layoutOpen: isOnsite && layoutOpen,
      layoutDone: isOnsite && !layoutOpen && !!st.layout,
      layoutLine: this.layoutLabelOf(st.layout),
      editLayout: () => this.setState({ setupEdit: 'layout' }),
      venueOpen: isOnsite && !!st.layout && venueOpen,
      venueDone: isOnsite && !!st.layout && !venueOpen && !!st.venue,
      venueLine: st.venue === 'indoor' ? 'Indoor' : (st.venue === 'outdoor' ? 'Outdoor' : ''),
      editVenue: () => this.setState({ setupEdit: 'venue' }),

      delivery: opt(st.type === 'delivery', () => this.setState({ type: 'delivery', layout: null, venue: null, consent: false, setupEdit: null })),
      onsite: opt(isOnsite, () => { this._scrollTo = 'layout'; this.setState({ type: 'onsite', consent: false, setupEdit: null }); }),
      buffet: opt(st.layout === 'buffet', () => { this._scrollTo = 'venue'; this.setState({ layout: 'buffet', consent: false, setupEdit: null }); }),
      live: opt(st.layout === 'live', () => { this._scrollTo = 'venue'; this.setState({ layout: 'live', consent: false, setupEdit: null }); }),
      both: opt(st.layout === 'both', () => { this._scrollTo = 'venue'; this.setState({ layout: 'both', consent: false, setupEdit: null }); }),
      indoor: opt(st.venue === 'indoor', () => this.setState({ venue: 'indoor', setupEdit: null })),
      outdoor: opt(st.venue === 'outdoor', () => this.setState({ venue: 'outdoor', setupEdit: null }))
    }, this.pkgVals(), this.itemsVals());
  }
}

<script>
window.__dcMount(Component, { start: 'details', popular: 2 }, 'tpl', 'app');
/* ------------------------------------------------------------------
   The daily code.

   The page stays covered until the right 4 digits are entered. The
   digits are checked by the database, not here, so the answer is not
   sitting in this file waiting to be read. Getting it wrong too often
   locks that browser out for an hour.

   Once accepted, the browser remembers it for the rest of the Dubai
   day and stops asking.

   Set BYM_CONFIG.gate to false to switch the whole thing off.
   ------------------------------------------------------------------ */
(function () {
  'use strict';

  var cfg = window.BYM_CONFIG || {};
  var body = document.body;
  function open() { body.classList.remove('locked'); }

  if (!cfg.gate || !cfg.supabaseUrl || !cfg.anonKey) { open(); return; }

  function dubaiDay() {
    try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dubai' }).format(new Date()); }
    catch (e) { return String(new Date().getUTCDate()); }
  }
  function remembered() { try { return localStorage.getItem('bym_gate'); } catch (e) { return null; } }
  function remember(d) { try { localStorage.setItem('bym_gate', d); } catch (e) {} }

  if (remembered() === dubaiDay()) { open(); return; }

  function sessionId() {
    try {
      var s = localStorage.getItem('bym_sid');
      if (s) return s;
    } catch (e) {}
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
    });
  }

  var wrap = document.createElement('div');
  wrap.id = 'gate';
  wrap.innerHTML =
    '<div class="gbox">' +
      '<div class="gmark">CATERING</div>' +
      '<h1>Build your Menu!</h1>' +
      '<p class="gtag">Enter today’s code to see the menu.</p>' +
      '<input id="gcode" inputmode="numeric" autocomplete="off" maxlength="4" ' +
        'aria-label="Today’s four digit code" placeholder="0000">' +
      '<button id="gGo" type="button">Open the menu</button>' +
      '<div id="gMsg" role="status"></div>' +
      '<p class="gnote">Ask Dragon Empire Catering for today’s code. It changes every night.</p>' +
    '</div>';
  body.appendChild(wrap);

  var input = document.getElementById('gcode');
  var go = document.getElementById('gGo');
  var msg = document.getElementById('gMsg');

  input.addEventListener('input', function () {
    input.value = input.value.replace(/[^0-9]/g, '').slice(0, 4);
    msg.textContent = '';
    if (input.value.length === 4) check();
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
  go.onclick = check;
  setTimeout(function () { try { input.focus(); } catch (e) {} }, 120);

  var busy = false;
  function check() {
    if (busy) return;
    var code = input.value;
    if (code.length !== 4) { msg.className = 'bad'; msg.textContent = 'Four digits, please.'; return; }
    busy = true; go.disabled = true;
    msg.className = ''; msg.textContent = 'Checking…';

    fetch(cfg.supabaseUrl + '/rest/v1/rpc/check_code', {
      method: 'POST',
      headers: {
        apikey: cfg.anonKey,
        Authorization: 'Bearer ' + cfg.anonKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_session: sessionId(), p_code: code })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (ok) {
        busy = false; go.disabled = false;
        if (ok === true) {
          remember(dubaiDay());
          wrap.classList.add('gone');
          setTimeout(function () { wrap.remove(); open(); }, 220);
          return;
        }
        msg.className = 'bad';
        msg.textContent = 'That code is not right for today.';
        input.value = '';
        input.focus();
      })
      .catch(function () {
        busy = false; go.disabled = false;
        msg.className = 'bad';
        msg.textContent = 'Could not check the code. Try again in a moment.';
      });
  }
})();
/* ------------------------------------------------------------------
   Loads the menu from the database.

   The dishes, package prices and themes used to live in this page. They
   live in Supabase now so the owner can change them without a code change.
   This file fetches them and hands them to the running app.

   It is deliberately unable to break the ordering page:
     - if the fetch fails, times out or returns nothing, the copy built
       into this page carries on exactly as before;
     - it gives up once the customer has started choosing, so a slow
       reply can never wipe out a selection in progress.
   ------------------------------------------------------------------ */
(function () {
  'use strict';

  var cfg = window.BYM_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.anonKey) return;

  var H = { apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey };
  var REST = cfg.supabaseUrl + '/rest/v1/';

  function get(path) {
    return fetch(REST + path, { headers: H })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  Promise.all([
    get('menu_items?select=name,cu,cat,diet,sub,note,img&order=sort.asc'),
    get('menu_config?select=data&limit=1')
  ]).then(function (res) {
    var items = res[0];
    var conf = res[1] && res[1][0] ? res[1][0].data : null;
    var inst = window.__dcInstance;

    if (!inst || typeof inst.applyMenu !== 'function') return;
    if (!items || items.length < 20) return;              // nothing useful came back
    if (inst.state.screen && inst.state.screen !== 'details') return;   // too late to swap
    if (Object.keys(inst.state.sel || {}).length) return;

    try { inst.applyMenu(items, conf); } catch (e) { /* built-in menu stands */ }
  });
})();
/* ------------------------------------------------------------------
   The phone's Back button.

   The whole app is one web page, so without this, Back leaves the site
   from wherever the customer happens to be - halfway through choosing
   dishes, with everything they had picked gone. This keeps a list of
   the places they have been and steps back through them instead, and
   only leaves the site once there is nowhere left to step back to.

   Only the fields that make a "place" are remembered: which screen,
   which photo is open, which dish's note is open. Nothing they typed
   or ticked is touched, so going back never costs them their work.

   The app's own Back buttons unwind this same list rather than adding
   to it, so the two always agree with each other.
   ------------------------------------------------------------------ */
(function () {
  'use strict';

  var KEYS = ['screen', 'themeView', 'zoom', 'noteFor'];

  var stack = [];        // every place visited, oldest first
  var idx = -1;          // where in that list we are now
  var applying = false;  // true while we are the ones changing the screen
  var inst = null;

  function snap(st) {
    var o = {}, i;
    for (i = 0; i < KEYS.length; i++) o[KEYS[i]] = st[KEYS[i]] == null ? null : st[KEYS[i]];
    // the first screen leaves state.screen empty and leans on props.start,
    // the same way the app itself works out which screen to draw
    o.screen = st.screen || (inst.props && inst.props.start) || 'details';
    return o;
  }

  function same(a, b) {
    for (var i = 0; i < KEYS.length; i++) if (a[KEYS[i]] !== b[KEYS[i]]) return false;
    return true;
  }

  function record() {
    if (applying || !inst) return;
    var p = snap(inst.state);
    if (idx >= 0 && same(p, stack[idx])) return;       // a change, but not a move

    // The app moved back a step by itself - its own Back button, or closing a
    // photo. Unwind the browser to match instead of piling another entry on.
    if (idx > 0 && same(p, stack[idx - 1])) {
      idx--;
      try { history.back(); } catch (e) {}
      return;
    }

    stack = stack.slice(0, idx + 1);                   // a new turning drops any
    stack.push(p);                                     // places that were ahead
    idx = stack.length - 1;
    try {
      if (idx === 0) history.replaceState({ dcNav: 0 }, '');
      else history.pushState({ dcNav: idx }, '');
    } catch (e) {}
  }

  function apply(p) {
    applying = true;
    try {
      inst.setState({ screen: p.screen, themeView: p.themeView,
                      zoom: p.zoom, noteFor: p.noteFor });
    } catch (e) {}
    applying = false;
  }

  addEventListener('popstate', function (e) {
    var i = e.state && typeof e.state.dcNav === 'number' ? e.state.dcNav : -1;
    if (!inst || i < 0 || i >= stack.length) return;   // somebody else's entry
    idx = i;
    apply(stack[i]);
  });

  function start() {
    inst = window.__dcInstance;
    if (!inst || typeof inst.setState !== 'function') { setTimeout(start, 60); return; }
    var orig = inst.setState.bind(inst);
    inst.setState = function (patch) { orig(patch); record(); };
    record();
  }

  start();
})();
/* ------------------------------------------------------------------
   Sends visits and leads to Supabase.

   Rules this file lives by:
     - it never interferes with the booking flow. Every call is wrapped,
       fire-and-forget, and a failure is silent to the customer;
     - it only writes. It cannot read anyone's data back;
     - with BYM_CONFIG.tracking = false it does nothing at all.
   ------------------------------------------------------------------ */
(function () {
  'use strict';

  var cfg = window.BYM_CONFIG || {};
  if (!cfg.tracking || !cfg.supabaseUrl || !cfg.anonKey) return;

  var RPC = cfg.supabaseUrl + '/rest/v1/rpc/';
  var SEND_AFTER_MS = 1500;   // wait for the customer to stop fiddling before saving

  /* ---------- who this browser is (random, meaningless on its own) ---------- */
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
    });
  }
  var sid;
  try {
    sid = localStorage.getItem('bym_sid');
    if (!sid) { sid = uuid(); localStorage.setItem('bym_sid', sid); }
  } catch (e) { sid = uuid(); }   // private window, blocked storage: still works, just not remembered

  // the app asks the database for the order number using this
  window.BYM_SESSION = sid;

  function post(fn, body) {
    try {
      var url = RPC + fn;
      var payload = JSON.stringify(body);
      var headers = {
        'apikey': cfg.anonKey,
        'Authorization': 'Bearer ' + cfg.anonKey,
        'Content-Type': 'application/json'
      };
      // keepalive lets the request finish even if the page is closing.
      // (sendBeacon cannot carry the auth headers Supabase needs, so it is not used.)
      fetch(url, { method: 'POST', headers: headers, body: payload, keepalive: true })
        .catch(function () {});
    } catch (e) { /* never let tracking break the page */ }
  }

  /* ---------- the link was opened ---------- */
  function linkToken() {
    try {
      var p = new URLSearchParams(location.search);
      return p.get('t') || p.get('token') || '';
    } catch (e) { return ''; }
  }
  function source() {
    try {
      var p = new URLSearchParams(location.search);
      var s = p.get('src') || p.get('utm_source') || '';
      if (s) return s;
      if (document.referrer) return document.referrer.slice(0, 180);
      return 'direct';
    } catch (e) { return ''; }
  }
  function device() {
    var ua = navigator.userAgent || '';
    if (/iPad|Tablet/i.test(ua)) return 'iPad';
    if (/iPhone/i.test(ua)) return 'iPhone';
    if (/Android/i.test(ua)) return 'Android';
    if (/Windows/i.test(ua)) return 'Windows';
    if (/Mac OS/i.test(ua)) return 'Mac';
    return 'Other';
  }

  post('track_visit', {
    p_session: sid,
    p_meta: { token: linkToken(), source: source(), device: device(), ua: (navigator.userAgent || '').slice(0, 280) }
  });

  /* ---------- what the customer has filled in so far ---------- */
  function names(inst, ids) {
    var out = [];
    try {
      for (var i = 0; i < inst.ITEMS.length; i++) {
        if (ids[inst.ITEMS[i].id]) out.push(inst.ITEMS[i].name);
      }
    } catch (e) {}
    return out;
  }

  /* Everything the order sheet needs, rebuilt later in the owner's panel.
     Dishes are stored by name and course, not by their position in the menu,
     so an order still reads correctly after dishes are added or removed. */
  function picked(inst) {
    var out = [], st = inst.state;
    try {
      for (var i = 0; i < inst.ITEMS.length; i++) {
        var x = inst.ITEMS[i];
        if (st.sel[x.id]) out.push({ name: x.name, cat: x.cat, note: (st.notes[x.id] || '').trim() });
      }
    } catch (e) {}
    return out;
  }

  function choices(st) {
    return {
      name: st.name || '', cc: st.cc || '+971', phone: st.phone || '',
      emirate: st.emirate || '', date: st.date || '', time: st.time || '',
      pax: st.pax, pureVeg: !!st.pureVeg,
      type: st.type || null, layout: st.layout || null, venue: st.venue || null,
      cuisine: st.cuisine || 'ic',
      pkg: (st.pkg === undefined ? null : st.pkg),
      counters: st.counters || {},
      theme: st.theme || null, eventNote: st.eventNote || ''
    };
  }

  function snapshot(inst) {
    var st = inst.state;
    var screen = st.screen || 'details';
    var done = (screen === 'thanks');
    var s = null;
    try { s = inst.summary(); } catch (e) {}

    return {
      name: st.name || '',
      phone: (st.name || st.phone) ? ((st.cc || '') + ' ' + (st.phone || '')).trim() : '',
      emirate: st.emirate || '',
      date: st.date || '',
      time: st.time || '',
      pax: st.pax ? String(st.pax) : '',
      pure_veg: !!st.pureVeg,
      step: screen,
      status: done ? 'completed' : 'started',
      // only a confirmed order carries a number, so the CO- run has no gaps
      ref: done && s ? (s.ref || '') : '',
      token: linkToken(),
      details: {
        setup: { type: st.type || null, layout: st.layout || null, venue: st.venue || null },
        menu: {
          cuisine: st.cuisine || null,
          package: (st.pkg === 'custom') ? 'custom' : (typeof st.pkg === 'number' ? st.pkg + 1 : null),
          dishes: names(inst, st.sel || {}),
          notes: st.notes || {}
        },
        theme: st.theme || null,
        eventNote: st.eventNote || '',
        totals: s ? { perPerson: s.ppText, menuTotal: s.menuTotal, grand: s.grandNum, grandText: s.grand } : null,
        order: { choices: choices(st), picked: picked(inst) }
      }
    };
  }

  /* ---------- save when something meaningful changes ---------- */
  var timer = null, lastSent = '';

  function maybeSend(force) {
    var inst = window.__dcInstance;
    if (!inst || !inst.state) return;
    var st = inst.state;
    // nothing is stored until page 1 is done: no name and number, no lead
    if (!st.name || !st.phone) return;

    var data = snapshot(inst);
    var sig = JSON.stringify(data);
    if (sig === lastSent) return;

    clearTimeout(timer);
    var go = function () { lastSent = sig; post('track_lead', { p_session: sid, p_data: data }); };
    if (force) go(); else timer = setTimeout(go, SEND_AFTER_MS);
  }

  var seen = '';
  setInterval(function () {
    var inst = window.__dcInstance;
    if (!inst || !inst.state) return;
    var st = inst.state;
    var quick = [st.screen, st.name, st.phone, st.emirate, st.date, st.time, st.pax, st.pureVeg,
                 st.type, st.layout, st.venue, st.cuisine, st.pkg, st.theme,
                 Object.keys(st.sel || {}).length, st.eventNote].join('|');
    if (quick === seen) return;
    seen = quick;
    maybeSend(st.screen === 'thanks');
  }, 700);

  // last chance to save when the customer leaves or hides the page
  addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') maybeSend(true);
  });
  addEventListener('pagehide', function () { maybeSend(true); });
})();
</script>
</body>
</html>
